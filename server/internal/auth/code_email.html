<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{.Title}} · 知新</title>
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    @media (prefers-color-scheme: dark) {
      .page { background-color: #000000 !important; }
      .card { background-color: #131315 !important; border-color: #2a2a2e !important; }
      .ink { color: #ececee !important; }
      .muted { color: #9d9da5 !important; }
      .code { background-color: #1e1e21 !important; color: #5b9bff !important; }
      .footer { border-color: #2a2a2e !important; }
    }
  </style>
</head>
<body class="page" style="margin:0;padding:0;background-color:#ffffff;">
  <table role="presentation" class="page" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" class="card" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;border:1px solid #e6e6e8;border-collapse:separate;border-radius:20px;background-color:#ffffff;font-family:system-ui,'Segoe UI','Microsoft YaHei',sans-serif;">
          <tr>
            <td style="padding:24px;text-align:left;">
              <p class="ink" style="margin:0 0 24px;color:#111111;font-size:20px;font-weight:700;line-height:1.3;">知新</p>
              <h1 class="ink" style="margin:0 0 8px;color:#111111;font-size:24px;font-weight:700;line-height:1.3;">{{.Title}}</h1>
              <p class="ink" style="margin:0 0 16px;color:#111111;font-size:16px;line-height:1.6;">{{.Instruction}}</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td class="code" align="center" style="padding:16px 8px;border-radius:12px;background-color:#edf3ff;color:#2563eb;font:700 32px/1.25 system-ui,'Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:4px;white-space:nowrap;">{{.Code}}</td>
                </tr>
              </table>
              <p class="muted" style="margin:12px 0 0;color:#6b6b72;font-size:14px;line-height:1.6;">{{.Expiry}}</p>
              <p class="footer muted" style="margin:24px 0 0;padding-top:16px;border-top:1px solid #e6e6e8;color:#6b6b72;font-size:14px;line-height:1.6;">{{.Footer}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
