openapi: 3.1.0
info:
  title: 知新 API
  version: 0.1.0
  description: |
    知新的自建后端。职责与边界见 docs/adr/0008，技术框架见 docs/adr/0009。
    本文件是接口的唯一真相；改动时服务端处理函数与客户端调用放进同一个 push。
    1.0.0 之前不承诺兼容（ADR-0001），客户端与服务端同时升级。

    所有错误都是 application/problem+json，客户端按 `code` 分支，不解析 `detail`。
servers:
  - url: http://localhost:8080
    description: 本地开发（内存存储）

security:
  - bearer: []

tags:
  - name: meta
  - name: auth
  - name: sync
  - name: backup
  - name: llm
  - name: app
  - name: cloud
  - name: admin

paths:
  /healthz:
    get:
      tags: [meta]
      security: []
      summary: 进程存活
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [meta]
      security: []
      summary: 依赖可用，并返回服务端接受的客户端 schema 版本
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/auth/register:
    post:
      tags: [auth]
      security: []
      summary: 注册并登录当前设备（按来源地址限流，与登录共用一个令牌桶）
      description: |
        `identifier` 是登录方式的值，服务端负责识别种类并规范化；现在只有邮箱能注册
        与登录，手机号与微信的入口还没有接，识别出来之后按 `invalid_request` 拒绝。
        同一个邮箱已经被别的账号登记时返回 409 `identifier_taken`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: 已注册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409":
          description: "`identifier_taken`：这种登录方式已经被别的账号使用"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录，每台设备一个会话（按来源地址限流，与注册共用一个令牌桶）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: 已登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401":
          description: "`invalid_credentials`，不区分账号不存在与密码错误"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: 用刷新令牌换一组新令牌，旧的两枚立即失效（按账号与来源地址限流）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              additionalProperties: false
              properties:
                refresh_token: { type: string }
                request_id:
                  type: string
                  maxLength: 64
                  description: |
                    这次刷新逻辑请求的标识，重试时原样带上。服务端据此判断旧刷新
                    令牌是原请求的重试还是被盗用：只有标识一致、且在轮换后的固定
                    宽限期内才按重试处理，否则撤销会话并记录安全事件。
      responses:
        "200":
          description: 已轮换
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/password/forgot:
    post:
      tags: [auth]
      security: []
      summary: 向账号登记的登录方式发送重设密码验证码
      description: |
        `identifier` 的识别与规范化同注册。这种登录方式尚未确认时，持有它的用户
        可以凭验证码恢复账号并确认归属；账号不存在时返回 204。发信失败返回 503，
        这种登录方式还没有接上发送通道时返回 501。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              additionalProperties: false
              properties:
                identifier: { type: string, maxLength: 254 }
      responses:
        "204": { description: 已受理 }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/password/reset:
    post:
      tags: [auth]
      security: []
      summary: 用验证码重设密码，并作废该账号的全部会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code, new_password]
              additionalProperties: false
              properties:
                identifier: { type: string, maxLength: 254 }
                code: { type: string, minLength: 6, maxLength: 6, pattern: "^[0-9]{6}$" }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: 已重设，其他设备需要重新登录 }
        "400":
          description: "`invalid_code` 或 `invalid_request`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出当前设备
      responses:
        "204": { description: 已退出 }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      tags: [auth]
      summary: 当前账号与它的登录方式
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [auth]
      summary: 删除账号，连同同步序列、附件、备份与用量一并删除
      description: |
        删除前必须重新提交当前密码，确认是账号本人在操作。密码错误返回 401
        `invalid_credentials`，与登录失败共用按账号的失败预算，超过时短暂返回
        429；应用收到该错误只提示密码错误，保留当前登录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "204": { description: 已删除 }
        "401":
          description: "`invalid_credentials`：密码不正确"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/identities/{id}/verification:
    post:
      tags: [auth]
      summary: 给某一种登录方式发送验证码
      description: |
        `id` 是 `GET /v1/me` 返回的登录方式编号。已经确认过的直接返回 204，不重复
        发送；刚发过的返回 429，`Retry-After` 给出建议等待的秒数。这种登录方式还没
        有接上发送通道时返回 501，发送通道没有配置好时返回 503。验证码为六位数字，
        默认十分钟有效，库里只存 HMAC-SHA256。
      parameters:
        - name: id
          in: path
          required: true
          description: 登录方式编号
          schema: { type: string }
      responses:
        "204": { description: 已发送，或这种登录方式已经确认 }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/me/identities/{id}/verification/confirm:
    post:
      tags: [auth]
      summary: 用验证码确认某一种登录方式
      description: |
        确认之后账号的“至少一种登录方式已验证”成立，托管额度与云端写入随之开放。
      parameters:
        - name: id
          in: path
          required: true
          description: 登录方式编号
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 6, maxLength: 6, pattern: "^[0-9]{6}$" }
      responses:
        "204": { description: 已确认 }
        "400":
          description: "`invalid_code`：不存在、已过期、已被换掉或输错次数过多"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/api-keys:
    get:
      tags: [auth]
      summary: 列出本账号的模型代理密钥，新的在前
      description: |
        密钥只用于用户自己的脚本或第三方工具调用 `/v1/llm` 下的模型接口，与账号
        共用每日额度、并发上限、实例预算与“登录方式已验证”的门槛，不持有学习数据
        （ADR-0063）。响应不含明文密钥与
        摘要，只有展示用的前缀；已经撤销的密钥仍然列出，`revoked` 为真。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: "`key_scope_denied`：用密钥调用账号接口；密钥只能调用模型接口"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [auth]
      summary: 撤销本账号的全部模型代理密钥
      description: |
        一次撤销所有仍然有效的密钥，已经撤销的保留原样；账号可疑或换用工具时用它
        一次清空。撤销之后这些密钥立刻不能再调用模型，登录状态不受影响。
      responses:
        "204": { description: 已全部撤销；本来就没有有效密钥时也返回 204 }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: "`key_scope_denied`：用密钥调用账号接口；撤销全部要用登录令牌"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      tags: [auth]
      summary: 签发一把模型代理密钥，明文只在这一次返回
      description: |
        密钥没有有效期，只能显式撤销。每个账号最多保留 20 把有效密钥，达到上限时
        返回 409，先撤销旧的再签发。服务端只保存 SHA-256，明文只在这次响应里出现。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 64, description: 给这把密钥起的名字，只用于辨认 }
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: "`key_scope_denied`：用密钥签发新的密钥；签发改用登录令牌"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`conflict`：有效密钥数已经达到上限"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/me/api-keys/{id}:
    delete:
      tags: [auth]
      summary: 撤销一把模型代理密钥，立即失效
      description: |
        撤销之后这把密钥立刻不能再调用模型，其余密钥与登录状态不受影响。已经撤销
        的密钥再撤销一次返回 404；撤销保留这一行，列表里仍能看到它。
      parameters:
        - name: id
          in: path
          required: true
          description: 密钥编号
          schema: { type: string }
      responses:
        "204": { description: 已撤销 }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: "`key_scope_denied`：用密钥调用账号接口；撤销要用登录令牌"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/cloud:
    delete:
      tags: [cloud]
      summary: 清除该账号的全部云端数据
      description: |
        依次清理整库备份、提交序列、附件以及对象存储里遗留的字节，可重复调用：
        中途失败时重试会从剩下的部分继续。清除期间这个账号的写入请求返回 409
        `conflict`，客户端退避之后重试；账号、会话与本机数据不受影响。应用在设置
        页显示完成状态，再询问是否恢复自动同步。
      requestBody: { $ref: "#/components/requestBodies/ConfirmPassword" }
      responses:
        "204": { description: 已清空；本来就是空的也返回 204 }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409":
          description: "`conflict`：该账号还有写入或清除请求在途，稍后重试"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/sync/head:
    get:
      tags: [sync]
      summary: 服务端序列的最新位置、保留下界与当前快照
      description: |
        `head` 是最新位置，`earliest_seq` 是保留下界（第一条仍然可以拉取的序号，
        没有删除过提交时为 1），`snapshot` 是账号当前快照的指针，没有登记时为
        `null`，`compact` 是服务端有没有打开快照压缩。客户端在首次同步与判断是否
        需要重新克隆时读这一份（ADR-0043）；`compact` 为假时客户端不上传整库快照，
        因为服务端不会按它删除提交（ADR-0047）。
        带 `X-Device-Id` 时更新设备名册的快照能力，能力或位置有变化时同时更新最近出现时间（ADR-0048）。
      parameters:
        - name: X-Device-Id
          in: header
          description: 设备标识，不超过 64 字符；带上它同步请求会更新账号设备名册的快照能力与设备位置，能力或位置有变化时同时更新最近出现时间（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 64 }
        - name: X-Sync-Capabilities
          in: header
          description: 逗号分隔的小写能力名，当前只有 `snapshot`；含 `snapshot` 时把这一台设备记为支持快照，其余取值忽略（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncHead" }
  /v1/sync/snapshot:
    get:
      tags: [sync]
      summary: 当前快照指针
      description: 与 `GET /v1/sync/head` 同形；没有登记过快照时 `snapshot` 为 `null`。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncHead" }
    put:
      tags: [sync]
      summary: 登记当前序列位置上的快照
      description: |
        一台已经同步到 `seq`、没有待推送提交的设备，把当前投影按检查点格式压缩之后
        走 `PUT /v1/blobs/{sha256}` 上传，再把附件的哈希与本机算出的整库摘要登记到
        这里。服务端只保存最新一份快照，不解析附件内容；`seq` 必须是本账号已经到达
        的位置，不能登记未来的位置，也不能用更小的位置覆盖已经登记的更新的快照。
        登记之后服务端可以删除快照位置及之前、超过保留期的提交，`earliest_seq` 跟着
        推进（ADR-0043）；压缩关闭、或名册里有活跃设备没有声明 `snapshot` 时只写
        指针（ADR-0047）。响应与 `GET /v1/sync/head` 相同。
      parameters:
        - name: X-Device-Id
          in: header
          description: 设备标识，不超过 64 字符；带上它同步请求会更新账号设备名册的快照能力与设备位置，能力或位置有变化时同时更新最近出现时间（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 64 }
        - name: X-Sync-Capabilities
          in: header
          description: 逗号分隔的小写能力名，当前只有 `snapshot`；含 `snapshot` 时把这一台设备记为支持快照，其余取值忽略（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotRegistration" }
      responses:
        "200":
          description: 已登记
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncHead" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409":
          description: "`conflict`：`seq` 小于已经登记的位置（`extra.snapshot_seq` 给出当前位置），或账号正在清除云端数据"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/Problem" }
  /v1/sync/devices:
    get:
      tags: [sync]
      summary: 账号的设备名册
      description: |
        按最近出现时间倒序返回名册，最多 50 条。每条带设备标识、用户设置的别名、
        是否支持快照、已经应用到的服务端序号与最近出现时间；名册只记录发过同步请求
        的设备。压缩门槛按它判断最近活跃的设备里有没有一台不支持快照，常规压缩还要
        停在这些设备的最小位置之后（ADR-0047、ADR-0054）。带 `X-Device-Id` 时先更新
        这台设备的名册记录再返回列表，刚登录、还没同步过的设备因此也能先出现在名册里。
      parameters:
        - name: X-Device-Id
          in: header
          description: 设备标识，不超过 64 字符；带上它同步请求会更新账号设备名册的快照能力与设备位置，能力或位置有变化时同时更新最近出现时间（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 64 }
        - name: X-Sync-Capabilities
          in: header
          description: 逗号分隔的小写能力名，当前只有 `snapshot`；含 `snapshot` 时把这一台设备记为支持快照，其余取值忽略（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDeviceList" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [sync]
      summary: 修改一台已知设备的别名
      description: |
        别名去掉首尾空白之后不超过 64 个字符，空串表示清除。只能改本账号名册里已有
        的设备，未知设备返回 404 `not_found`；改名不改写已经推送的提交，提交里的
        设备标识保持不变（ADR-0048）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncDeviceRename" }
      responses:
        "200":
          description: 已改名
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDevice" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: "`conflict`：账号正在清除云端数据"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sync/refs:
    get:
      tags: [sync]
      summary: 账号的命名版本
      description: |
        返回本账号全部命名版本，按名字排序，包括删除之后留下的墓碑（`deleted_at` 非空）。
        服务端只保存与转发名字、指向的提交身份与备注，不解析内容；名字按 NFC 规范化之后
        比较，历史本身不随名字同步，服务端压缩之后旧名字引用的提交可能已经不在
        （ADR-0054）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRefList" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [sync]
      summary: 写入或删除一个命名版本
      description: |
        请求体是两种形状之一：写入时带 `name`、`commit_uid` 与可选的 `note`，删除时带
        `name` 与 `delete: true`。后写覆盖先写，不记冲突；名字已经是墓碑时，删除时间
        之后的写入会复活它，更早的写入不复活、返回的仍是墓碑。名字先做 NFC 规范化，
        规范化之后最长 30 个字符；未删除的名字每账号最多 200 个，超限返回 400
        `invalid_request`。写入引用不到本账号的提交 `uid` 也可以，只是那台设备上显示为
        只剩标签（ADR-0054）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRefWrite" }
      responses:
        "200":
          description: 已写入的命名版本；不复活时返回的是已存的墓碑
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409":
          description: "`conflict`：账号正在清除云端数据"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sync/commits:
    delete:
      tags: [sync]
      summary: 清空该账号的提交序列，服务端 head 重置为 0
      description: |
        删除这个账号在服务端保存的全部提交，把 head 重置为 0，并清掉快照指针、设备名册与
        命名版本；账号与整库备份不受影响。操作不可撤销，调用前须重新确认当前密码。成功
        返回 204，没有响应体。
      requestBody: { $ref: "#/components/requestBodies/ConfirmPassword" }
      responses:
        "204": { description: 已清空 }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [sync]
      summary: 拉取 seq 大于 after 的提交
      description: |
        按序号顺序返回一页提交，`has_more` 为真时用本页最后一个序号继续拉取。
        `earliest_seq` 是保留下界，`snapshot` 是当前快照指针。客户端要的下一条已经
        被压缩删除时（`after + 1 < earliest_seq`，包括保留下界大于 1 而 `after` 为 0
        的首次同步）返回 410 `history_compacted`，`extra` 给出保留下界、head 与快照
        的序号、哈希和摘要，客户端据此下载快照、把位置改成快照位置之后继续增量拉取
        （ADR-0043）。`after` 恰好等于 `earliest_seq - 1` 时照常返回。带 `X-Device-Id`
        时把 `after` 记为这台设备已经应用到的位置，供常规压缩判断能不能删到那里
        （ADR-0054）。
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - name: X-Device-Id
          in: header
          description: 设备标识，不超过 64 字符；带上它同步请求会更新账号设备名册的快照能力与设备位置，能力或位置有变化时同时更新最近出现时间（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 64 }
        - name: X-Sync-Capabilities
          in: header
          description: 逗号分隔的小写能力名，当前只有 `snapshot`；含 `snapshot` 时把这一台设备记为支持快照，其余取值忽略（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitPage" }
        "410":
          description: "`history_compacted`：`after` 落在已经压缩的区间，客户端按快照重新克隆"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
    post:
      tags: [sync]
      summary: 推送本机提交
      description: |
        `base_seq` 必须等于服务端当前 head，否则返回 409，`extra.head` 给出最新位置；
        客户端先拉取、在本机应用为新的提交，再重新推送。已经收到过的 `uid` 会被跳过，
        因此丢失响应后原样重试是安全的。响应里的 `seqs` 与请求里的 `commits` 按条数
        与顺序一一对应：新提交是服务端分配的序号，被当作重复跳过的提交回它原来的
        序号，客户端据此判断整批重放（ADR-0054）。每次 1 到 200 条，单条最多 2 MiB，
        请求最多 16 MiB。生产实例要求至少一种登录方式已经验证，账号同步日志预算为 256 MiB。
        每条提交必须带 `kind`，取值是 `baseline`、`write`、`undo`、`restore`、`import`
        或 `maintenance`，缺字段或未知取值返回 400 `invalid_request`；来源只看
        `device_id` 一类字段，没有 `remote` 这种取值（审查 S23、V18）。服务端原样保存
        这条提交的类型，拉取时原样带回。
        没有 `X-Device-Id` 时按提交里的设备标识补进设备名册，快照能力与别名留空
        （ADR-0048）。
      parameters:
        - name: X-Device-Id
          in: header
          description: 设备标识，不超过 64 字符；带上它同步请求会更新账号设备名册的快照能力与设备位置，能力或位置有变化时同时更新最近出现时间（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 64 }
        - name: X-Sync-Capabilities
          in: header
          description: 逗号分隔的小写能力名，当前只有 `snapshot`；含 `snapshot` 时把这一台设备记为支持快照，其余取值忽略（ADR-0048、ADR-0054）。
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_seq, commits]
              properties:
                base_seq: { type: integer, format: int64 }
                commits:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/Commit" }
      responses:
        "200":
          description: 已追加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/blobs/{sha256}:
    parameters:
      - { name: sha256, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    head:
      tags: [sync]
      summary: 附件是否已上传
      description: |
        按内容寻址：路径里的 sha256 是附件内容的哈希，服务端按账号隔离。
        200 表示这个账号已经存过相同的内容，`Content-Length` 给出字节数；
        HEAD 没有响应体，未命中时只有 404。
      responses:
        "200": { description: 已存在 }
        "400": { description: 路径里的 sha256 不是 64 位小写十六进制 }
        "404": { description: 不存在 }
    get:
      tags: [sync]
      summary: 下载附件
      responses:
        "200":
          description: 原始字节，`X-Content-SHA256` 与路径一致
          content:
            application/octet-stream: {}
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [sync]
      summary: 上传附件，服务端核对哈希
      description: |
        请求体是原始字节，单个附件的上限由 ZHIXIN_MAX_ATTACHMENT_BYTES 决定。
        内容与路径里的 sha256 不一致时返回 400，超过单个上限返回 413
        `payload_too_large`。一个账号的全部附件总量上限由
        ZHIXIN_MAX_ACCOUNT_ATTACHMENT_BYTES 决定，超限返回 413 `storage_full`，
        `extra` 里带 `used_bytes` 与 `limit_bytes`。同一账号重复上传相同内容写到
        同一个键，结果不变，也不重复计入总量。
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "201": { description: 已保存 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "413":
          description: "`payload_too_large` 或 `storage_full`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/backups:
    delete:
      tags: [backup]
      summary: 清空该账号的全部整库备份
      description: |
        删除这个账号在服务端保存的全部备份，元数据行与对象存储里的字节一并删除，账号与同步
        提交序列不受影响。操作不可撤销，调用前须重新确认当前密码。
      requestBody: { $ref: "#/components/requestBodies/ConfirmPassword" }
      responses:
        "204": { description: 已清空 }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [backup]
      summary: 列出整库备份，新的在前
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
    post:
      tags: [backup]
      summary: 上传一份版本库备份 zip，超过保留份数时删最旧的
      parameters:
        - { name: X-Content-SHA256, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: X-Schema-Version, in: header, required: true, schema: { type: integer } }
        - name: X-Device-Name
          in: header
          description: 设备名，按 percent-encoding 编码 UTF-8 字节后放在头里；服务端解码后保存原文。
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/zip: {}
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/backups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [backup]
      summary: 下载备份；客户端按现有的版本库恢复流程预检
      responses:
        "200":
          description: zip 原样返回，响应头带 X-Content-SHA256 与 X-Schema-Version
          content:
            application/zip: {}
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [backup]
      summary: 删除一份备份
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/llm/models:
    get:
      tags: [llm]
      summary: 当前可用的模型，OpenAI 列表格式
      description: |
        列出管理后台启用、并且至少有一条可用路由的对外模型。每一项带 `kind`，聊天
        模型是 `chat`，嵌入模型是 `embedding`；嵌入模型配置了维度时带 `dimensions`，
        客户端据此建立索引。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
  /v1/llm/quota:
    get:
      tags: [llm]
      summary: 今日用量与额度
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMQuota" }
  /v1/llm/responses:
    post:
      tags: [llm]
      summary: OpenAI Responses 代理
      description: |
        客户端唯一的对话线格式（ADR-0052）。请求体按 Responses 组装：`model`、
        `instructions`、`input` 条目（`message`、`function_call`、
        `function_call_output`）、扁平的 `tools`、`tool_choice`、
        `max_output_tokens`、`stream` 与 `store: false`，客户端不使用
        `previous_response_id`，也不发送 `temperature` 与 `top_p`。服务端校验
        `model` 后转发到来源的 `/responses`，只放行白名单内的字段，其余字段回 400。
        `store` 放行但不按客户端取值转发：服务端在转发前一律写成 `false`，因为
        Responses 接口在缺少该字段时默认让上游保存响应。
        `max_output_tokens` 取 16 到 32768，省略时补 4096，与客户端的上限一致，
        超出范围回 400 `invalid_request`。额度预留与结算取流里
        `response.completed` 的 `usage`（`input_tokens`、`output_tokens`），非流式
        取响应体的 `usage`，缺少用量时保留预留值。错误分类为
        `model_not_allowed`（400）、`contact_unverified`（403）、
        `quota_exceeded`（429）、`unavailable`（503）、`upstream_failed`（502），
        本轮预算用完且没有任何来源交付有效输出时回 504 `upstream_failed`。
        流式响应在交付正文、拒答或完整工具调用之前仍可换来源，先行事件由服务端暂存。
        交付之后，这次流绑定当前来源。达到输出上限时保留截断结果。
      parameters:
        - name: X-Zhixin-Round-Budget-Ms
          in: header
          required: false
          description: |
            客户端从用户发出这一轮提问开始计算的本轮剩余预算，单位毫秒。服务端按
            `ZHIXIN_LLM_ROUND_BUDGET_MAX` 截断这个值，整段回答、两次事件之间的
            空闲等待与每次尝试等待首个有效输出都收在这份预算以内；省略时只按本机
            时限执行。值 0 表示这一轮预算已经用完，服务端不再发起上游尝试。
          schema: { type: integer, format: int64, minimum: 0 }
        - name: X-Zhixin-Session-Id
          in: header
          required: false
          description: |
            客户端为一条讨论生成的稳定标识，最长 64 个字符，只参与主用组内的路由
            选择：同一讨论的追问与工具步骤因此落到同一条来源，复用上游已经处理过
            的前缀。服务端按账号再散列一次，日志与上游都不携带原值；省略、空白或
            超过 64 个字符时按没有标识处理，每次请求按权重重新随机。
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: { type: string }
                instructions: { type: string }
                input:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                tools:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                tool_choice: {}
                max_output_tokens:
                  type: integer
                  minimum: 16
                  maximum: 32768
                  default: 4096
                  description: 省略时服务端补 4096，每次尝试按它与请求字节预留额度
                stream: { type: boolean }
                store:
                  type: boolean
                  description: 接受但不使用客户端的取值；服务端转发给来源时固定写成 false
      responses:
        "200":
          description: 提供方的响应，流式时为 text/event-stream，事件名为 response.*
        "400": { $ref: "#/components/responses/Problem" }
        "403":
          description: "`contact_unverified`：账号还没有任何一种已验证的登录方式，托管额度未开放"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "504":
          description: "`upstream_failed`：本轮预算用完，没有任何来源交付有效输出"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/llm/embeddings:
    post:
      tags: [llm]
      summary: OpenAI Embeddings 代理，支持批量
      description: |
        请求体与 OpenAI Embeddings 相同，`input` 只接受字符串或字符串数组，条数上限
        由 `ZHIXIN_LLM_EMBEDDING_MAX_INPUTS` 决定。服务端按路由的 `max_batch` 把一次
        请求拆成几批并发发给同一个来源，再按原顺序合并，`index` 从 0 连续编号；一批
        失败时整次请求换下一个来源重做，同一次请求的向量因此总是来自同一个来源。
        用量记入账号当天的嵌入额度，与聊天额度分开计；提供方没有返回 `usage` 时按
        输入字符数估算。代理自身的拒绝与聊天接口相同，另有 `invalid_request`（400，
        `input` 为空、超过条数上限或含有非字符串，或者 `dimensions` 与模型配置的维度
        不一致）。请求头带 `X-Zhixin-Embedding-Cache: 1` 时，服务端在嵌入成功之后
        按输入的 SHA-256 把这些向量写入这个账号的缓存，重复写入不覆盖已有行；只有
        自动同步开启、且这次是索引刷新的客户端才带这个头（ADR-0030）。
      parameters:
        - name: X-Zhixin-Embedding-Cache
          in: header
          required: false
          description: 值为 `1` 时把这次嵌入的结果写入按账号隔离的向量缓存
          schema: { type: string }
        - name: X-Zhixin-Workload
          in: header
          required: false
          description: |
            `query` 表示用户正在等待的检索查询，`batch` 表示材料导入、索引重建与补算
            这类可以等的后台批次；后台批次在账号并发与实例内存上只能用前台之外的
            剩余容量，占不到时返回 429，由客户端稍后重试。省略时按 `query` 处理。
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingRequest" }
      responses:
        "200":
          description: 合并之后的向量列表；提供方的错误状态与响应体原样返回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingList" }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/llm/embeddings/lookup:
    post:
      tags: [llm]
      summary: 批量查找已缓存的嵌入向量
      description: |
        按账号与对外模型查找已经算过的向量，命中时客户端不再重复嵌入。`hashes` 是
        片段文本按 UTF-8 字节计算的 SHA-256 小写十六进制，单次最多
        `ZHIXIN_LLM_EMBEDDING_MAX_INPUTS` 条，与 `/v1/llm/embeddings` 一致。响应只含
        命中的条目，全部未命中不是错误；查找不消耗额度，不写 `llm_usage`，访问日志
        与嵌入接口一样只记录路由、状态与字节数。`embedding` 是小端序 FP16 的 base64，
        客户端解码之后按现有方式归一化。缓存属于派生数据，可以从业务库与嵌入服务
        重建：只在客户端带 `X-Zhixin-Embedding-Cache: 1` 的嵌入请求成功之后写入，
        随清除云端数据与删除账号一起删除，不进入数据包与整库备份（ADR-0030）。
      parameters:
        - name: X-Zhixin-Workload
          in: header
          required: false
          description: |
            `query` 表示用户正在等待的检索查询，`batch` 表示材料导入、索引重建与补算
            这类可以等的后台批次；两者都只影响并发与内存的排队顺序，不改变返回内容。
            省略时按 `query` 处理，旧客户端因此不受限制。
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingLookupRequest" }
      responses:
        "200":
          description: 命中的向量；全部未命中时 `vectors` 为空数组并省略 `dimensions`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingLookupResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403":
          description: "`contact_unverified`：账号还没有任何一种已验证的登录方式，托管额度未开放"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/app/releases:
    get:
      tags: [app]
      security: []
      summary: 应用安装包的发布清单
      description: |
        不需要登录：更新提示在登录之前也可能出现。清单来自服务端本地的发布文件
        （`ZHIXIN_RELEASE_FILE`），服务端只原样给出每个平台的版本、构建号、地址与
        说明，不比较客户端版本，也不判断客户端是否低于建议的最低版本；客户端按平台取一项，
        自己比较 `version` 与 `build`。没有配置发布文件时返回空数组，客户端据此不提示更新。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseList" }

  /v1/telemetry/active:
    post:
      tags: [app]
      security: []
      summary: 匿名上报一次活跃
      description: |
        没有登录的设备每天最多上报一次，内容只有随机安装标识、应用版本与平台，
        不含学习内容。服务端按收到的自然日保存一行，只存安装标识的
        HMAC-SHA256，原始标识不落库；同一标识同一天重复上报是幂等的，客户端丢失
        响应后原样重试安全。登录用户的活跃由服务端按请求日期统计，不需要调用这个
        接口。数据按 180 天滚动删除。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryPing" }
      responses:
        "204": { description: 已记录，或今天已经记录过 }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/feedback:
    post:
      tags: [app]
      security: []
      summary: 提交一条应用内反馈
      description: |
        登录与否都可以提交，服务端不把反馈绑定到账号。`content` 是用户填写的正文，
        `diagnostics` 是可选的诊断摘要，两者都原样保存，服务端不解析内容；客户端在
        附带诊断摘要之前应在本地说明会提交哪些内容。按来源地址限流。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Feedback" }
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackReceipt" }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/v1/providers:
    get:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 列出模型来源与健康状态
      description: |
        列出管理后台保存的来源。key 不返回，只给出是否已设置与末四位。健康状态来自
        本进程的最近调用，重启后清空。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProviderList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 新建一个模型来源
      description: |
        编号放在请求体里，已经存在时返回 409，不覆盖原来源；修改已有来源用
        `PUT /admin/v1/providers/{id}`。`api_key` 可以省略，保存之后只返回末四位。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProviderInput" }
      responses:
        "201":
          description: 新建的来源
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProvider" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /admin/v1/providers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,31}$" } }
    put:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 修改一个已有的模型来源
      description: |
        只修改已有来源，编号不存在时返回 404；新建来源用 `POST /admin/v1/providers`。
        `api_key` 省略时保留原来的 key，传空字符串时清除。key 用 `ZHIXIN_SECRET_KEY`
        加密后入库，没有配置这个密钥时保存带 key 的来源返回 503。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProviderInput" }
      responses:
        "200":
          description: 保存之后的来源
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProvider" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 删除一个模型来源
      description: 还有模型路由指向它时返回 409，`extra.models` 列出这些模型。
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/providers/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 用来源的 key 请求一次 /models，检查地址与 key
      responses:
        "200":
          description: 检查结果；连不上或被拒时 ok 为 false，不返回错误状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProbe" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/v1/usage:
    get:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 托管模型的每日用量与路由汇总
      parameters:
        - name: days
          in: query
          description: 包含今天，按服务端时区计算
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        "200":
          description: 按日及按路由汇总的托管调用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsageReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /admin/v1/models:
    get:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 列出对外模型与各自的路由
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModelList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 新建一个对外模型及其全部路由
      description: |
        名称放在请求体里，已经存在时返回 409，不覆盖原模型；修改已有模型用
        `PUT /admin/v1/models/{name}`，路由整体替换。嵌入模型的各条路由必须产出
        同一个向量空间（同一个模型的不同部署），服务端不核对这一点。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModelInput" }
      responses:
        "201":
          description: 新建的模型
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/models/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$" } }
    put:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 修改一个已有的对外模型及其全部路由
      description: |
        只修改已有模型，名称不存在时返回 404；新建模型用 `POST /admin/v1/models`。
        路由整体替换。嵌入模型的各条路由必须产出同一个向量空间（同一个模型的不同
        部署），服务端不核对这一点。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModelInput" }
      responses:
        "200":
          description: 保存之后的模型
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 删除一个对外模型
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/v1/models/{name}/test:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 按路由发一次最小请求，检查这个模型能否调用
      description: 聊天模型发一句“ping”并限制一个 token，嵌入模型嵌入一个短句。两个路由参数都省略时按正常路由规则调用，同时指定时只测试该条路由。探测不计入账号额度或路由用量。
      parameters:
        - name: provider_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: upstream_model
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: 检查结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProbe" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  requestBodies:
    ConfirmPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            additionalProperties: false
            properties:
              password: { type: string, minLength: 1, maxLength: 128 }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 不透明访问令牌，一小时过期；刷新令牌三十天过期并在每次刷新时轮换。`zx_` 开头的是模型代理密钥，只接受 `/v1/llm` 下的模型接口，与账号共用额度，没有有效期（ADR-0063）。
    admin:
      type: http
      scheme: bearer
      description: 管理令牌，等于服务端的 `ZHIXIN_ADMIN_TOKEN`；没有配置时管理接口一律 404。
  responses:
    RateLimited:
      description: 尝试过于频繁，`code` 为 `rate_limited`；`Retry-After` 给出建议的等待秒数
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
          description: 建议的重试间隔，秒
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: 错误
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    EmbeddingRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      properties:
        model: { type: string }
        input:
          description: 一段文本或文本数组
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
    EmbeddingList:
      type: object
      required: [object, data, model, usage]
      properties:
        object: { type: string, examples: [list] }
        model: { type: string, description: 对外模型名 }
        data:
          type: array
          items:
            type: object
            required: [object, index, embedding]
            properties:
              object: { type: string, examples: [embedding] }
              index: { type: integer }
              embedding: { description: 浮点数组；请求带 encoding_format=base64 时是字符串 }
        usage:
          type: object
          required: [prompt_tokens, total_tokens]
          properties:
            prompt_tokens: { type: integer, format: int64 }
            total_tokens: { type: integer, format: int64 }
    EmbeddingLookupRequest:
      type: object
      required: [model, hashes]
      additionalProperties: false
      properties:
        model: { type: string }
        hashes:
          type: array
          description: 片段文本按 UTF-8 字节计算的 SHA-256，小写十六进制
          items: { type: string }
    EmbeddingLookupResult:
      type: object
      required: [model, vectors]
      properties:
        model: { type: string, description: 对外模型名 }
        dimensions:
          type: integer
          description: 模型配置的维度；没有配置时取命中行的维度，全部未命中时省略
        vectors:
          type: array
          description: 命中的条目，顺序与请求无关
          items:
            type: object
            required: [hash, embedding]
            properties:
              hash: { type: string, description: 请求里的文本哈希 }
              embedding: { type: string, description: 小端序 FP16 的 base64 }
    AdminProbe:
      type: object
      required: [ok, latency_ms]
      properties:
        ok: { type: boolean }
        status: { type: integer, description: 提供方的 HTTP 状态码，连不上时省略 }
        latency_ms: { type: integer, format: int64 }
        provider_id: { type: string }
        upstream_model: { type: string }
        models: { type: array, items: { type: string }, description: 来源 /models 返回的模型名，最多 500 个 }
        dimensions: { type: integer, description: 嵌入模型实际返回的维度 }
        error: { type: string, description: 失败原因，不含 key }
        attempts:
          type: array
          description: 模型测试实际执行的路由，按尝试顺序列出
          items: { $ref: "#/components/schemas/AdminProbeAttempt" }
    AdminProbeAttempt:
      type: object
      required: [provider_id, upstream_model, ok, recovery_probe]
      properties:
        provider_id: { type: string }
        upstream_model: { type: string }
        ok: { type: boolean }
        recovery_probe: { type: boolean, description: 本次使用来源或路由的恢复试探名额 }
        status: { type: integer }
        error: { type: string, description: 服务端给出的失败原因，不含上游响应正文 }
    AdminHealth:
      type: object
      required: [state, consecutive_failures]
      properties:
        state: { type: string, enum: [ok, cooling, probe_ready, probing, key_error] }
        consecutive_failures: { type: integer }
        last_error: { type: string }
        last_error_at: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time }
        cooling_until: { type: string, format: date-time }
    AdminProvider:
      type: object
      required: [id, name, base_url, enabled, has_key, note, health]
      properties:
        id: { type: string }
        name: { type: string }
        base_url: { type: string }
        enabled: { type: boolean }
        has_key: { type: boolean }
        key_hint: { type: string, description: key 的末四位 }
        note: { type: string }
        updated_at: { type: string, format: date-time }
        health: { $ref: "#/components/schemas/AdminHealth" }
    AdminProviderList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminProvider" }
    AdminProviderInput:
      type: object
      required: [base_url]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
          description: 新建时必填；修改时省略，或与路径里的编号一致
        name: { type: string, maxLength: 64 }
        base_url: { type: string, maxLength: 512, description: OpenAI 兼容的基础地址，例如 https://api.deepseek.com/v1 }
        api_key: { type: string, maxLength: 512, description: 省略时保留原值，空字符串表示清除 }
        enabled: { type: boolean, default: true }
        note: { type: string, maxLength: 200 }
    AdminUsageCounts:
      type: object
      required: [attempts, first_attempts, failover_attempts, successes, truncated_attempts, canceled_attempts, tokens, estimated_tokens, input_tokens, cached_tokens]
      properties:
        attempts: { type: integer, format: int64, description: 尝试路由的次数，嵌入拆批仍计一次 }
        first_attempts: { type: integer, format: int64, description: 每次请求首次执行的路由尝试 }
        failover_attempts: { type: integer, format: int64, description: 同一请求内首次尝试失败后实际执行的路由尝试 }
        successes: { type: integer, format: int64 }
        truncated_attempts: { type: integer, format: int64, description: 达到输出上限的尝试 }
        canceled_attempts: { type: integer, format: int64, description: 客户端取消或断开时未完成的尝试 }
        tokens: { type: integer, format: int64 }
        estimated_tokens: { type: integer, format: int64, description: tokens 中按估算结算的部分 }
        input_tokens: { type: integer, format: int64, description: 上游报告的输入量之和；没有报告时为 0 }
        cached_tokens: { type: integer, format: int64, description: input_tokens 中命中上游缓存的部分，用于计算缓存命中占比 }
    AdminUsageDay:
      type: object
      required: [day, chat, embedding]
      properties:
        day: { type: string, format: date }
        chat: { $ref: "#/components/schemas/AdminUsageCounts" }
        embedding: { $ref: "#/components/schemas/AdminUsageCounts" }
    AdminUsageRoute:
      type: object
      required: [model, kind, provider_id, upstream_model, usage, daily]
      properties:
        model: { type: string }
        kind: { $ref: "#/components/schemas/ModelKind" }
        provider_id: { type: string }
        upstream_model: { type: string }
        usage: { $ref: "#/components/schemas/AdminUsageCounts" }
        daily:
          type: object
          description: 按服务端自然日汇总，键为 YYYY-MM-DD，只包含该路由有记录的日期。
          additionalProperties: { $ref: "#/components/schemas/AdminUsageCounts" }
    AdminUsageReport:
      type: object
      required: [timezone, daily, routes]
      properties:
        timezone: { type: string }
        daily:
          type: array
          items: { $ref: "#/components/schemas/AdminUsageDay" }
        routes:
          type: array
          items: { $ref: "#/components/schemas/AdminUsageRoute" }
    AdminRoute:
      type: object
      required: [provider_id, upstream_model, priority, weight, max_batch, enabled, supports_tools, supports_images, state, health]
      properties:
        provider_id: { type: string }
        upstream_model: { type: string, description: 来源侧的模型名，例如 BAAI/bge-m3 }
        priority: { type: integer, description: 数字小的先试 }
        weight: { type: integer, description: 同一优先级内按权重分流 }
        max_batch: { type: integer, description: 嵌入一次发给来源的最多条数，0 表示不拆分 }
        enabled: { type: boolean }
        supports_tools: { type: boolean, description: 按实际调用核对过函数调用；请求带 tools 时只走这类路由 }
        supports_images: { type: boolean, description: 按实际调用核对过图片输入；请求带图片时只走这类路由 }
        state: { type: string, enum: [ready, cooling, probe_ready, probing, disabled, provider_disabled, key_error, provider_missing] }
        health: { $ref: "#/components/schemas/AdminHealth", description: 这条路由自身的健康状态 }
    AdminRouteInput:
      type: object
      required: [provider_id, upstream_model]
      additionalProperties: false
      properties:
        provider_id: { type: string }
        upstream_model: { type: string, minLength: 1, maxLength: 128 }
        priority: { type: integer, minimum: 0, maximum: 100, default: 0 }
        weight: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        max_batch: { type: integer, minimum: 0, maximum: 2048, default: 0 }
        enabled: { type: boolean, default: true }
        supports_tools: { type: boolean, default: true, description: 省略时按支持处理，与加筛选之前的行为一致 }
        supports_images: { type: boolean, default: true, description: 省略时按支持处理，与加筛选之前的行为一致 }
    AdminModel:
      type: object
      required: [name, kind, enabled, available, note, routes]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ModelKind" }
        enabled: { type: boolean }
        available: { type: boolean, description: 模型启用且至少一条路由可参与转发，包含冷却中的备用路由 }
        dimensions: { type: integer }
        note: { type: string }
        updated_at: { type: string, format: date-time }
        routes:
          type: array
          items: { $ref: "#/components/schemas/AdminRoute" }
    AdminModelList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminModel" }
    AdminModelInput:
      type: object
      required: [kind, routes]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
          description: 新建时必填；修改时省略，或与路径里的名称一致
        kind: { $ref: "#/components/schemas/ModelKind" }
        enabled: { type: boolean, default: true }
        dimensions: { type: integer, minimum: 1, maximum: 8192, description: 只用于嵌入模型 }
        note: { type: string, maxLength: 200 }
        routes:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/AdminRouteInput" }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, examples: ["urn:zhixin:problem:conflict"] }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - invalid_credentials
            - invalid_code
            - identifier_taken
            - contact_unverified
            - key_scope_denied
            - not_found
            - conflict
            - payload_too_large
            - storage_full
            - history_compacted
            - model_not_allowed
            - rate_limited
            - quota_exceeded
            - upstream_failed
            - unavailable
            - not_implemented
            - internal
        detail: { type: string, description: 只给开发者看，不含学习内容 }
        request_id: { type: string }
        extra: { type: object, additionalProperties: true }
    Credentials:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          maxLength: 254
          description: 登录方式的值，服务端识别种类并规范化；现在只接受邮箱
        password: { type: string, minLength: 8, maxLength: 128 }
        device_name: { type: string, maxLength: 64 }
    Tokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
        user_id: { type: string }
    Change:
      type: object
      description: 对应客户端 revision_change 的一行（docs/01 第 7 章）
      required: [table, row_key, op]
      properties:
        table: { type: string }
        row_key: { type: string }
        op: { type: string, enum: [insert, update, delete] }
        # 行内容原样转发，服务端不解释。用 json.RawMessage 而不是 interface{}，
        # 否则大整数会被解码成 float64 而改变数值。
        before:
          description: "update 与 delete 必填"
          x-go-type: json.RawMessage
        after:
          description: "insert 与 update 必填"
          x-go-type: json.RawMessage
    Commit:
      type: object
      required: [uid, kind, device_id, schema_version, actor, action, created_at, changes]
      properties:
        seq: { type: integer, format: int64, readOnly: true }
        uid:
          type: string
          maxLength: 64
          description: 客户端在用户动作发生时生成的提交身份，同一动作重试时沿用；服务端按它永久去重
        kind:
          description: |
            这条提交做了什么，取值与客户端的 revisionKinds 一致；来源只看 device_id
            一类字段，不设 remote 取值（审查 S23、V18）。推送时必须给出，缺字段或
            未知取值返回 400 `invalid_request`。
          type: string
          enum: [baseline, write, undo, restore, import, maintenance]
        device_id: { type: string, maxLength: 64 }
        schema_version: { type: integer }
        actor: { type: string, enum: [user, ai, system] }
        action: { type: string }
        created_at: { type: string, description: "客户端时间，YYYY-MM-DD HH:MM:SS" }
        received_at: { type: string, format: date-time, readOnly: true }
        # 可选：客户端在“推送完成且本机没有待推送提交”时把当前整库摘要附在最后
        # 一条提交上（改进方案 3.5）。服务端只保存与转发，不解析也不校验，拉取时
        # 原样带回，其他设备据此比较本机摘要。
        state_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            客户端按改进方案 3.5 算出的整库摘要（SHA-256 多重集哈希的十六进制）；
            只有推送完成、本机没有待推送提交时最后一条提交才带这个字段。
        table_digests:
          type: object
          additionalProperties: { type: string, pattern: "^[0-9a-f]{64}$" }
          description: |
            按表拆开的同一份摘要，表名到 64 位十六进制值的映射，各值之和等于这条提交的
            state_digest。服务端原样保存与回传，不解析；没有带的提交在响应里不出现这个键
            （ADR-0054）。
        changes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Change" }
    Backup:
      type: object
      properties:
        id: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        schema_version: { type: integer }
        device_name: { type: string }
        created_at: { type: string, format: date-time }
    BackupList:
      type: object
      required: [backups]
      properties:
        backups:
          type: array
          items: { $ref: "#/components/schemas/Backup" }
    CommitPage:
      type: object
      required: [commits, head, has_more, earliest_seq]
      properties:
        commits:
          type: array
          items: { $ref: "#/components/schemas/Commit" }
        head: { type: integer, format: int64 }
        has_more: { type: boolean }
        earliest_seq:
          type: integer
          format: int64
          description: 保留下界，第一条仍然可以拉取的序号；没有删除过提交时为 1
        snapshot:
          description: 当前快照指针，没有登记时省略
          $ref: "#/components/schemas/SyncSnapshot"
    Feedback:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: 用户填写的反馈正文
        contact:
          type: string
          format: email
          maxLength: 254
          description: 可选的联系邮箱，用于回复这条反馈
        app_version:
          type: string
          maxLength: 64
          description: 客户端版本名，例如 0.2.0-dev+3
        platform:
          type: string
          maxLength: 32
          description: 平台，例如 android
        diagnostics:
          type: string
          maxLength: 65536
          description: 可选的诊断摘要，UTF-8 编码后至多 65536 字节，客户端先说明附带哪些内容
    FeedbackReceipt:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    LLMQuota:
      type: object
      required: [day, used_tokens, daily_tokens, embedding_used_tokens, embedding_daily_tokens]
      properties:
        day: { type: string, format: date }
        used_tokens: { type: integer, format: int64, description: 聊天当天已用 }
        daily_tokens: { type: integer, format: int64, description: 聊天每日额度 }
        embedding_used_tokens: { type: integer, format: int64, description: 嵌入当天已用 }
        embedding_daily_tokens: { type: integer, format: int64, description: 嵌入每日额度 }
    Me:
      type: object
      required: [user_id, created_at, identities]
      properties:
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        identities:
          type: array
          description: 这个账号的登录方式；现在只会有一条邮箱
          items: { $ref: "#/components/schemas/Identity" }
    IdentityKind:
      type: string
      description: 登录方式的种类；表结构的 check 约束与这里一致
      enum: [email, phone, wechat]
    Identity:
      type: object
      required: [id, kind, identifier, verified]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/IdentityKind" }
        identifier: { type: string, description: 规范化之后的联系方式 }
        verified: { type: boolean, description: 这种登录方式是否已经用验证码确认 }
    ApiKey:
      type: object
      required: [id, name, prefix, revoked, created_at]
      properties:
        id: { type: string }
        name: { type: string, description: 用户起的名字，只用于辨认 }
        prefix:
          type: string
          examples: ["zx_AbCdEfGh"]
          description: 密钥的前几位，用于在列表里辨认；完整密钥只在签发时返回
        revoked: { type: boolean, description: 是否已经撤销 }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          description: 最近一次调用模型的时间，服务端按十分钟粒度更新；从没用过时省略
    ApiKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
    ApiKeyCreated:
      type: object
      required: [id, name, prefix, key, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        key:
          type: string
          description: "完整密钥，只在这一次返回；调用模型时放在 `Authorization: Bearer` 里"
        created_at: { type: string, format: date-time }
    Model:
      type: object
      required: [id, object, owned_by, kind]
      properties:
        id: { type: string }
        object: { type: string, examples: [model] }
        owned_by: { type: string }
        kind: { $ref: "#/components/schemas/ModelKind" }
        dimensions: { type: integer, description: 嵌入模型的向量维度，没有配置时省略 }
    ModelKind:
      type: string
      enum: [chat, embedding]
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, examples: [list] }
        data:
          type: array
          items: { $ref: "#/components/schemas/Model" }
    PushResult:
      type: object
      required: [head, seqs]
      properties:
        head: { type: integer, format: int64 }
        seqs:
          type: array
          items: { type: integer, format: int64 }
          description: |
            与请求里的 commits 按条数与顺序一一对应；新提交是服务端分配的序号，被当作
            重复跳过的提交回它在服务端记下的原序号（ADR-0054）。
    Ready:
      type: object
      required: [status, schema_version]
      properties:
        status: { type: string, const: ready }
        schema_version: { type: integer, examples: [32] }
    Release:
      type: object
      required: [platform, version, build, url, sha256, signature]
      properties:
        platform: { type: string, examples: [android] }
        version: { type: string, examples: ["0.2.0"] }
        build: { type: integer, format: int64, description: Android 的 versionCode }
        published_at: { type: string, examples: ["2026-12-21"] }
        url: { type: string, description: 安装包地址，必须是 https }
        sha256: { type: string, description: 安装包的 SHA-256，64 位小写十六进制 }
        signature:
          type: string
          description: |
            安装包 SHA-256 的 Ed25519 签名（base64）。应用使用内置公钥验证签名，
            验签通过之后才下载安装包。
        size: { type: integer, format: int64 }
        min_version: { type: string, description: 低于它的客户端在提示里加上建议尽快更新的说明，不阻断使用 }
        notes: { type: string, description: 这一版的更新说明 }
    ReleaseList:
      type: object
      required: [releases]
      properties:
        releases:
          type: array
          items: { $ref: "#/components/schemas/Release" }
    SyncHead:
      type: object
      required: [head, schema_version, earliest_seq, compact]
      properties:
        head: { type: integer, format: int64 }
        schema_version: { type: integer }
        earliest_seq:
          type: integer
          format: int64
          description: 保留下界，第一条仍然可以拉取的序号；没有删除过提交时为 1
        compact:
          type: boolean
          description: 服务端有没有打开快照压缩（`ZHIXIN_SYNC_COMPACT`）；为假时客户端不上传整库快照，服务端登记只写指针
        snapshot:
          description: 当前快照指针，没有登记时省略
          $ref: "#/components/schemas/SyncSnapshot"
    SyncSnapshot:
      type: object
      description: 账号当前快照的指针（ADR-0043）
      required: [seq, sha256, digest, created_at]
      properties:
        seq:
          type: integer
          format: int64
          description: 快照覆盖到的服务端序列位置；从它继续增量拉取
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 快照附件的哈希，按它走 GET /v1/blobs/{sha256} 下载
        digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 客户端按改进方案 3.5 算出的整库摘要，服务端原样保存
        created_at: { type: string, format: date-time }
    SyncDevice:
      type: object
      description: 账号设备名册里的一台设备（ADR-0048、ADR-0054）
      required: [device_id, alias, snapshot_capable, synced_seq, last_seen]
      properties:
        device_id: { type: string }
        alias: { type: string, description: 用户设置的别名，空串表示未命名 }
        snapshot_capable:
          type: boolean
          description: 这一台设备是否声明了 snapshot 能力；现在是唯一的一种能力，请求头含 snapshot 时置为 true
        synced_seq:
          type: integer
          format: int64
          description: 这台设备已经应用到的服务端序号，不超过当前 head；常规压缩不越过活跃窗口内设备的最小值
        last_seen: { type: string, format: date-time, description: 最近一次同步请求的服务端时间 }
    SyncRef:
      type: object
      description: 账号级命名版本的一行（ADR-0054）
      required: [name, commit_uid, note, updated_at]
      properties:
        name: { type: string, description: NFC 规范化之后的名字，最长 30 个字符 }
        commit_uid: { type: string, description: 这个名字指向的提交身份；服务端不核对它是否存在 }
        note: { type: string, description: 用户写的备注，服务端原样保存 }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          description: 删除时间；非空表示这个名字是墓碑，没有这个键表示名字仍然有效
    SyncRefList:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items: { $ref: "#/components/schemas/SyncRef" }
    SyncRefWrite:
      type: object
      description: 写入或删除一个命名版本，两种形状二选一（ADR-0054）
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: 名字，服务端按 NFC 规范化之后计长度，最长 30 个字符
        commit_uid: { type: string, maxLength: 64, description: 写入时必填，删除时忽略 }
        note: { type: string, maxLength: 200, description: 写入时的备注，删除时忽略 }
        source_updated_at: { type: string, format: date-time, description: 本机改名时间，用于判断写入是否早于墓碑 }
        delete: { type: boolean, description: 为真表示删除这个名字，此时不需要 commit_uid }
    SyncDeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/SyncDevice" }
    SyncDeviceRename:
      type: object
      required: [device_id, alias]
      properties:
        device_id: { type: string, maxLength: 64 }
        alias:
          type: string
          maxLength: 64
          description: 去掉首尾空白之后 0–64 个字符，空串表示清除
    SnapshotRegistration:
      type: object
      description: 登记一份快照（ADR-0043）
      required: [seq, sha256, digest]
      additionalProperties: false
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: 快照覆盖到的服务端序列位置；不能超过当前 head
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 已经上传到这个账号的快照附件哈希
        digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 客户端按改进方案 3.5 算出的整库摘要
    TelemetryPing:
      type: object
      required: [install_id]
      additionalProperties: false
      properties:
        install_id:
          type: string
          minLength: 16
          maxLength: 128
          description: 首次启动时随机生成并保存在应用私有目录，卸载或清空数据后重新生成
        app_version: { type: string, maxLength: 64 }
        platform: { type: string, maxLength: 32 }
