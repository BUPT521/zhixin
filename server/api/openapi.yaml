openapi: 3.1.0
info:
  title: 知新 API
  version: 0.1.0
  description: |
    知新的自建后端。职责与边界见 docs/adr/0008，技术框架见 docs/adr/0009。
    本文件是接口的唯一真相；改动时服务端处理函数与客户端调用放进同一个 push。
    1.0.0 之前不承诺兼容（ADR-0001），客户端与服务端同时升级。

    所有错误都是 application/problem+json，客户端按 `code` 分支，不解析 `detail`。
servers:
  - url: http://localhost:8080
    description: 本地开发（内存存储）

security:
  - bearer: []

tags:
  - name: meta
  - name: auth
  - name: sync
  - name: backup
  - name: llm
  - name: app
  - name: cloud
  - name: admin

paths:
  /healthz:
    get:
      tags: [meta]
      security: []
      summary: 进程存活
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [meta]
      security: []
      summary: 依赖可用，并返回服务端接受的客户端 schema 版本
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/auth/register:
    post:
      tags: [auth]
      security: []
      summary: 注册并登录当前设备（按来源地址限流，与登录共用一个令牌桶）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: 已注册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409":
          description: "`email_taken`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录，每台设备一个会话（按来源地址限流，与注册共用一个令牌桶）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: 已登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401":
          description: "`invalid_credentials`，不区分邮箱不存在与密码错误"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: 用刷新令牌换一组新令牌，旧的两枚立即失效（按账号与来源地址限流）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              additionalProperties: false
              properties:
                refresh_token: { type: string }
                request_id:
                  type: string
                  maxLength: 64
                  description: |
                    这次刷新逻辑请求的标识，重试时原样带上。服务端据此判断旧刷新
                    令牌是原请求的重试还是被盗用：只有标识一致、且在轮换后的固定
                    宽限期内才按重试处理，否则撤销会话并记录安全事件。
      responses:
        "200":
          description: 已轮换
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/email/verify/request:
    post:
      tags: [auth]
      summary: 给当前账号的邮箱发一封验证码邮件
      description: |
        已确认的邮箱直接返回 204，不重复发信；刚发过的账号返回 429，`Retry-After`
        给出建议等待的秒数。服务端没有配置 SMTP 时返回 503，客户端提示稍后再试。
        验证码为六位数字，默认十分钟有效，只存 HMAC-SHA256。
      responses:
        "204": { description: 已发送，或邮箱已经确认 }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/email/verify/confirm:
    post:
      tags: [auth]
      summary: 用验证码确认当前账号的邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 6, maxLength: 6, pattern: "^[0-9]{6}$" }
      responses:
        "204": { description: 已确认 }
        "400":
          description: "`invalid_code`：不存在、已过期、已被换掉或输错次数过多"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/password/forgot:
    post:
      tags: [auth]
      security: []
      summary: 向账号登记的邮箱发送重设密码验证码
      description: |
        邮箱尚未验证时，持有该邮箱的用户可以凭验证码恢复账号并确认邮箱归属。
        邮箱不存在时返回 204。发信失败返回 503，客户端提示稍后再试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "204": { description: 已受理 }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/password/reset:
    post:
      tags: [auth]
      security: []
      summary: 用验证码重设密码，并作废该账号的全部会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, minLength: 6, maxLength: 6, pattern: "^[0-9]{6}$" }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: 已重设，其他设备需要重新登录 }
        "400":
          description: "`invalid_code` 或 `invalid_request`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出当前设备
      responses:
        "204": { description: 已退出 }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      tags: [auth]
      summary: 当前账号
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [auth]
      summary: 删除账号，连同同步序列、附件、备份与用量一并删除
      description: |
        删除前必须重新提交当前密码，确认是账号本人在操作。密码错误返回 401
        `invalid_credentials`，与登录失败共用按账号的失败预算，超过时短暂返回
        429；应用收到该错误只提示密码错误，保留当前登录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "204": { description: 已删除 }
        "401":
          description: "`invalid_credentials`：密码不正确"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/cloud:
    delete:
      tags: [cloud]
      summary: 清除该账号的全部云端数据
      description: |
        依次清理整库备份、提交序列、附件以及对象存储里遗留的字节，可重复调用：
        中途失败时重试会从剩下的部分继续。清除期间这个账号的写入请求返回 409
        `conflict`，客户端退避之后重试；账号、会话与本机数据不受影响。应用在设置
        页显示完成状态，再询问是否恢复自动同步。
      requestBody: { $ref: "#/components/requestBodies/ConfirmPassword" }
      responses:
        "204": { description: 已清空；本来就是空的也返回 204 }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409":
          description: "`conflict`：该账号还有写入或清除请求在途，稍后重试"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/sync/head:
    get:
      tags: [sync]
      summary: 服务端序列的最新位置
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncHead" }
  /v1/sync/commits:
    delete:
      tags: [sync]
      summary: 清空该账号的提交序列，服务端 head 重置为 0
      description: |
        删除这个账号在服务端保存的全部提交，并把 head 重置为 0，账号与整库备份不受影响。
        操作不可撤销，调用前须重新确认当前密码。成功返回 204，没有响应体。
      requestBody: { $ref: "#/components/requestBodies/ConfirmPassword" }
      responses:
        "204": { description: 已清空 }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [sync]
      summary: 拉取 seq 大于 after 的提交
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitPage" }
        "413": { $ref: "#/components/responses/Problem" }
    post:
      tags: [sync]
      summary: 推送本机提交
      description: |
        `base_seq` 必须等于服务端当前 head，否则返回 409，`extra.head` 给出最新位置；
        客户端先拉取、在本机应用为新的提交，再重新推送。已经收到过的 `request_id`
        会被跳过，因此丢失响应后原样重试是安全的。每次 1 到 200 条，单条最多 2 MiB，
        请求最多 16 MiB。生产实例要求已验证邮箱，账号同步日志预算为 256 MiB。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_seq, commits]
              properties:
                base_seq: { type: integer, format: int64 }
                commits:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/Commit" }
      responses:
        "200":
          description: 已追加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/blobs/{sha256}:
    parameters:
      - { name: sha256, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    head:
      tags: [sync]
      summary: 附件是否已上传
      description: |
        按内容寻址：路径里的 sha256 是附件内容的哈希，服务端按账号隔离。
        200 表示这个账号已经存过相同的内容，`Content-Length` 给出字节数；
        HEAD 没有响应体，未命中时只有 404。
      responses:
        "200": { description: 已存在 }
        "400": { description: 路径里的 sha256 不是 64 位小写十六进制 }
        "404": { description: 不存在 }
    get:
      tags: [sync]
      summary: 下载附件
      responses:
        "200":
          description: 原始字节，`X-Content-SHA256` 与路径一致
          content:
            application/octet-stream: {}
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [sync]
      summary: 上传附件，服务端核对哈希
      description: |
        请求体是原始字节，单个附件的上限由 ZHIXIN_MAX_ATTACHMENT_BYTES 决定。
        内容与路径里的 sha256 不一致时返回 400，超过单个上限返回 413
        `payload_too_large`。一个账号的全部附件总量上限由
        ZHIXIN_MAX_ACCOUNT_ATTACHMENT_BYTES 决定，超限返回 413 `storage_full`，
        `extra` 里带 `used_bytes` 与 `limit_bytes`。同一账号重复上传相同内容写到
        同一个键，结果不变，也不重复计入总量。
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "201": { description: 已保存 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "413":
          description: "`payload_too_large` 或 `storage_full`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/backups:
    delete:
      tags: [backup]
      summary: 清空该账号的全部整库备份
      description: |
        删除这个账号在服务端保存的全部备份，元数据行与对象存储里的字节一并删除，账号与同步
        提交序列不受影响。操作不可撤销，调用前须重新确认当前密码。
      requestBody: { $ref: "#/components/requestBodies/ConfirmPassword" }
      responses:
        "204": { description: 已清空 }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [backup]
      summary: 列出整库备份，新的在前
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
    post:
      tags: [backup]
      summary: 上传一份版本库备份 zip，超过保留份数时删最旧的
      parameters:
        - { name: X-Content-SHA256, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: X-Schema-Version, in: header, required: true, schema: { type: integer } }
        - { name: X-Device-Name, in: header, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/zip: {}
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/backups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [backup]
      summary: 下载备份；客户端按现有的版本库恢复流程预检
      responses:
        "200":
          description: zip 原样返回，响应头带 X-Content-SHA256 与 X-Schema-Version
          content:
            application/zip: {}
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [backup]
      summary: 删除一份备份
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/llm/models:
    get:
      tags: [llm]
      summary: 当前可用的模型，OpenAI 列表格式
      description: |
        列出管理后台与环境变量里启用、并且至少有一条可用路由的对外模型。每一项带
        `kind`，聊天模型是 `chat`，嵌入模型是 `embedding`；嵌入模型配置了维度时带
        `dimensions`，客户端据此建立索引。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
  /v1/llm/quota:
    get:
      tags: [llm]
      summary: 今日用量与额度
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMQuota" }
  /v1/llm/chat/completions:
    post:
      tags: [llm]
      summary: OpenAI Chat Completions 代理
      description: |
        请求体按 Chat Completions 转发，服务端只读取 `model` 与 `stream`，并把 `model`
        换成路由选中的来源侧模型名，其余字段原样保留。一个对外模型可以配置多个来源，
        按优先级与权重选择；连接失败、429、5xx、401 与 403 在还没有向客户端写出任何
        字节之前换下一个来源重试，其余状态码直接返回。流式请求由服务端打开
        `stream_options.include_usage`，用量从最后一块的 `usage` 读取；提供方没有给出
        或者连接提前断开时，按请求与已转发的字节估算。提供方的状态码与响应体原样返回，
        只有最后一个来源拒绝服务端 key（401、403）时改为 `upstream_failed`，不转发它的
        错误体。代理自身的拒绝用 problem+json：`model_not_allowed`（400，模型不存在、
        停用或不是聊天模型）、`quota_exceeded`（429）、`unavailable`（503，没有配置任何
        模型）、`upstream_failed`（502，所有来源都无法连接或拒绝了 key）。
        未验证邮箱时服务端返回 403 email_unverified，并发达到账号上限时返回 429。
        账号用途额度与实例总预算都在转发前预留。非流式响应有大小上限，流式响应有空闲与总时限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string }
                stream: { type: boolean }
      responses:
        "200":
          description: 提供方的响应，流式时为 text/event-stream
        "400": { $ref: "#/components/responses/Problem" }
        "403":
          description: "`email_unverified`：账号还没确认邮箱，托管额度未开放"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/llm/embeddings:
    post:
      tags: [llm]
      summary: OpenAI Embeddings 代理，支持批量
      description: |
        请求体与 OpenAI Embeddings 相同，`input` 只接受字符串或字符串数组，条数上限
        由 `ZHIXIN_LLM_EMBEDDING_MAX_INPUTS` 决定。服务端按路由的 `max_batch` 把一次
        请求拆成几批并发发给同一个来源，再按原顺序合并，`index` 从 0 连续编号；一批
        失败时整次请求换下一个来源重做，同一次请求的向量因此总是来自同一个来源。
        用量记入账号当天的嵌入额度，与聊天额度分开计；提供方没有返回 `usage` 时按
        输入字符数估算。代理自身的拒绝与聊天接口相同，另有 `invalid_request`（400，
        `input` 为空、超过条数上限或含有非字符串，或者 `dimensions` 与模型配置的维度
        不一致）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingRequest" }
      responses:
        "200":
          description: 合并之后的向量列表；提供方的错误状态与响应体原样返回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingList" }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/app/releases:
    get:
      tags: [app]
      security: []
      summary: 应用安装包的发布清单
      description: |
        不需要登录：更新提示在登录之前也可能出现。清单来自服务端本地的发布文件
        （`ZHIXIN_RELEASE_FILE`），服务端只原样给出每个平台的版本、构建号、地址与
        说明，不比较客户端版本，也不决定是否必须更新；客户端按平台取一项，自己比较
        `version` 与 `build`。没有配置发布文件时返回空数组，客户端据此不提示更新。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseList" }

  /v1/telemetry/active:
    post:
      tags: [app]
      security: []
      summary: 匿名上报一次活跃
      description: |
        没有登录的设备每天最多上报一次，内容只有随机安装标识、应用版本与平台，
        不含学习内容。服务端按收到的自然日保存一行，只存安装标识的
        HMAC-SHA256，原始标识不落库；同一标识同一天重复上报是幂等的，客户端丢失
        响应后原样重试安全。登录用户的活跃由服务端按请求日期统计，不需要调用这个
        接口。数据按 180 天滚动删除。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryPing" }
      responses:
        "204": { description: 已记录，或今天已经记录过 }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/feedback:
    post:
      tags: [app]
      security: []
      summary: 提交一条应用内反馈
      description: |
        登录与否都可以提交，服务端不把反馈绑定到账号。`content` 是用户填写的正文，
        `diagnostics` 是可选的诊断摘要，两者都原样保存，服务端不解析内容；客户端在
        附带诊断摘要之前应在本地说明会提交哪些内容。按来源地址限流。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Feedback" }
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackReceipt" }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/v1/providers:
    get:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 列出模型来源与健康状态
      description: |
        包括管理后台保存的来源与环境变量生成的只读来源 `env`。key 不返回，只给出
        是否已设置与末四位。健康状态来自本进程的最近调用，重启后清空。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProviderList" }
        "401": { $ref: "#/components/responses/Problem" }
  /admin/v1/providers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,31}$" } }
    put:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 新建或修改一个模型来源
      description: |
        `api_key` 省略时保留原来的 key，传空字符串时清除。key 用 `ZHIXIN_SECRET_KEY`
        加密后入库，没有配置这个密钥时保存带 key 的来源返回 503。`env` 是保留名。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProviderInput" }
      responses:
        "200":
          description: 保存之后的来源
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProvider" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 删除一个模型来源
      description: 还有模型路由指向它时返回 409，`extra.models` 列出这些模型。
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/v1/providers/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 用来源的 key 请求一次 /models，检查地址与 key
      responses:
        "200":
          description: 检查结果；连不上或被拒时 ok 为 false，不返回错误状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProbe" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/v1/models:
    get:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 列出对外模型与各自的路由
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModelList" }
        "401": { $ref: "#/components/responses/Problem" }
  /admin/v1/models/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$" } }
    put:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 新建或修改一个对外模型及其全部路由
      description: |
        路由整体替换。同名的环境变量模型被管理后台的配置覆盖。嵌入模型的各条路由
        必须产出同一个向量空间（同一个模型的不同部署），服务端不核对这一点。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModelInput" }
      responses:
        "200":
          description: 保存之后的模型
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 删除一个对外模型
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/v1/models/{name}/test:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 按路由发一次最小请求，检查这个模型能否调用
      description: 聊天模型发一句“ping”并限制一个 token，嵌入模型嵌入一个短句；不计入任何账号的额度。
      responses:
        "200":
          description: 检查结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProbe" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  requestBodies:
    ConfirmPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            additionalProperties: false
            properties:
              password: { type: string, minLength: 1, maxLength: 128 }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 不透明访问令牌，一小时过期；刷新令牌三十天过期并在每次刷新时轮换。
    admin:
      type: http
      scheme: bearer
      description: 管理令牌，等于服务端的 `ZHIXIN_ADMIN_TOKEN`；没有配置时管理接口一律 404。
  responses:
    RateLimited:
      description: 尝试过于频繁，`code` 为 `rate_limited`；`Retry-After` 给出建议的等待秒数
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
          description: 建议的重试间隔，秒
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: 错误
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    EmbeddingRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      properties:
        model: { type: string }
        input:
          description: 一段文本或文本数组
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
    EmbeddingList:
      type: object
      required: [object, data, model, usage]
      properties:
        object: { type: string, examples: [list] }
        model: { type: string, description: 对外模型名 }
        data:
          type: array
          items:
            type: object
            required: [object, index, embedding]
            properties:
              object: { type: string, examples: [embedding] }
              index: { type: integer }
              embedding: { description: 浮点数组；请求带 encoding_format=base64 时是字符串 }
        usage:
          type: object
          required: [prompt_tokens, total_tokens]
          properties:
            prompt_tokens: { type: integer, format: int64 }
            total_tokens: { type: integer, format: int64 }
    AdminProbe:
      type: object
      required: [ok, latency_ms]
      properties:
        ok: { type: boolean }
        status: { type: integer, description: 提供方的 HTTP 状态码，连不上时省略 }
        latency_ms: { type: integer, format: int64 }
        provider_id: { type: string }
        upstream_model: { type: string }
        models: { type: array, items: { type: string }, description: 来源 /models 返回的模型名，最多 500 个 }
        dimensions: { type: integer, description: 嵌入模型实际返回的维度 }
        error: { type: string, description: 失败原因，不含 key }
    AdminProviderHealth:
      type: object
      required: [state, consecutive_failures]
      properties:
        state: { type: string, enum: [ok, cooling, key_error] }
        consecutive_failures: { type: integer }
        last_error: { type: string }
        last_error_at: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time }
        cooling_until: { type: string, format: date-time }
    AdminProvider:
      type: object
      required: [id, name, base_url, enabled, has_key, note, source, health]
      properties:
        id: { type: string }
        name: { type: string }
        base_url: { type: string }
        enabled: { type: boolean }
        has_key: { type: boolean }
        key_hint: { type: string, description: key 的末四位 }
        note: { type: string }
        source: { type: string, enum: [admin, env], description: env 来自环境变量，只读 }
        updated_at: { type: string, format: date-time }
        health: { $ref: "#/components/schemas/AdminProviderHealth" }
    AdminProviderList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminProvider" }
    AdminProviderInput:
      type: object
      required: [base_url]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64 }
        base_url: { type: string, maxLength: 512, description: OpenAI 兼容的基础地址，例如 https://api.deepseek.com/v1 }
        api_key: { type: string, maxLength: 512, description: 省略时保留原值，空字符串表示清除 }
        enabled: { type: boolean, default: true }
        note: { type: string, maxLength: 200 }
    AdminRoute:
      type: object
      required: [provider_id, upstream_model, priority, weight, max_batch, enabled]
      properties:
        provider_id: { type: string }
        upstream_model: { type: string, description: 来源侧的模型名，例如 BAAI/bge-m3 }
        priority: { type: integer, description: 数字小的先试 }
        weight: { type: integer, description: 同一优先级内按权重分流 }
        max_batch: { type: integer, description: 嵌入一次发给来源的最多条数，0 表示不拆分 }
        enabled: { type: boolean }
    AdminRouteInput:
      type: object
      required: [provider_id, upstream_model]
      additionalProperties: false
      properties:
        provider_id: { type: string }
        upstream_model: { type: string, minLength: 1, maxLength: 128 }
        priority: { type: integer, minimum: 0, maximum: 100, default: 0 }
        weight: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        max_batch: { type: integer, minimum: 0, maximum: 2048, default: 0 }
        enabled: { type: boolean, default: true }
    AdminModel:
      type: object
      required: [name, kind, enabled, note, source, routes]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ModelKind" }
        enabled: { type: boolean }
        dimensions: { type: integer }
        note: { type: string }
        source: { type: string, enum: [admin, env] }
        updated_at: { type: string, format: date-time }
        routes:
          type: array
          items: { $ref: "#/components/schemas/AdminRoute" }
    AdminModelList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminModel" }
    AdminModelInput:
      type: object
      required: [kind, routes]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/ModelKind" }
        enabled: { type: boolean, default: true }
        dimensions: { type: integer, minimum: 1, maximum: 8192, description: 只用于嵌入模型 }
        note: { type: string, maxLength: 200 }
        routes:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/AdminRouteInput" }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, examples: ["urn:zhixin:problem:conflict"] }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - invalid_credentials
            - invalid_code
            - email_taken
            - email_unverified
            - not_found
            - conflict
            - payload_too_large
            - storage_full
            - model_not_allowed
            - rate_limited
            - quota_exceeded
            - upstream_failed
            - unavailable
            - not_implemented
            - internal
        detail: { type: string, description: 只给开发者看，不含学习内容 }
        request_id: { type: string }
        extra: { type: object, additionalProperties: true }
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        device_name: { type: string, maxLength: 64 }
    Tokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
        user_id: { type: string }
    Change:
      type: object
      description: 对应客户端 revision_change 的一行（docs/01 第 7 章）
      required: [table, row_key, op]
      properties:
        table: { type: string }
        row_key: { type: string }
        op: { type: string, enum: [insert, update, delete] }
        # 行内容原样转发，服务端不解释。用 json.RawMessage 而不是 interface{}，
        # 否则大整数会被解码成 float64 而改变数值。
        before:
          description: "update 与 delete 必填"
          x-go-type: json.RawMessage
        after:
          description: "insert 与 update 必填"
          x-go-type: json.RawMessage
    Commit:
      type: object
      required: [request_id, device_id, schema_version, actor, action, created_at, changes]
      properties:
        seq: { type: integer, format: int64, readOnly: true }
        request_id: { type: string, maxLength: 64 }
        device_id: { type: string, maxLength: 64 }
        schema_version: { type: integer }
        actor: { type: string, enum: [user, ai, system] }
        action: { type: string }
        created_at: { type: string, description: "客户端时间，YYYY-MM-DD HH:MM:SS" }
        received_at: { type: string, format: date-time, readOnly: true }
        changes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Change" }
    Backup:
      type: object
      properties:
        id: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        schema_version: { type: integer }
        device_name: { type: string }
        created_at: { type: string, format: date-time }
    BackupList:
      type: object
      required: [backups]
      properties:
        backups:
          type: array
          items: { $ref: "#/components/schemas/Backup" }
    CommitPage:
      type: object
      required: [commits, head, has_more]
      properties:
        commits:
          type: array
          items: { $ref: "#/components/schemas/Commit" }
        head: { type: integer, format: int64 }
        has_more: { type: boolean }
    Feedback:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: 用户填写的反馈正文
        contact:
          type: string
          format: email
          maxLength: 254
          description: 可选的联系邮箱，用于回复这条反馈
        app_version:
          type: string
          maxLength: 64
          description: 客户端版本名，例如 0.2.0-dev+3
        platform:
          type: string
          maxLength: 32
          description: 平台，例如 android
        diagnostics:
          type: string
          maxLength: 65536
          description: 可选的诊断摘要，UTF-8 编码后至多 65536 字节，客户端先说明附带哪些内容
    FeedbackReceipt:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    LLMQuota:
      type: object
      required: [day, used_tokens, daily_tokens, embedding_used_tokens, embedding_daily_tokens]
      properties:
        day: { type: string, format: date }
        used_tokens: { type: integer, format: int64, description: 聊天当天已用 }
        daily_tokens: { type: integer, format: int64, description: 聊天每日额度 }
        embedding_used_tokens: { type: integer, format: int64, description: 嵌入当天已用 }
        embedding_daily_tokens: { type: integer, format: int64, description: 嵌入每日额度 }
    Me:
      type: object
      required: [user_id, email, email_verified, created_at]
      properties:
        user_id: { type: string }
        email: { type: string }
        email_verified: { type: boolean, description: 邮箱是否已经用验证码确认 }
        created_at: { type: string, format: date-time }
    Model:
      type: object
      required: [id, object, owned_by, kind]
      properties:
        id: { type: string }
        object: { type: string, examples: [model] }
        owned_by: { type: string }
        kind: { $ref: "#/components/schemas/ModelKind" }
        dimensions: { type: integer, description: 嵌入模型的向量维度，没有配置时省略 }
    ModelKind:
      type: string
      enum: [chat, embedding]
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, examples: [list] }
        data:
          type: array
          items: { $ref: "#/components/schemas/Model" }
    PushResult:
      type: object
      required: [head]
      properties:
        head: { type: integer, format: int64 }
    Ready:
      type: object
      required: [status, schema_version]
      properties:
        status: { type: string, const: ready }
        schema_version: { type: integer, examples: [27] }
    Release:
      type: object
      required: [platform, version, build, url, sha256, signature]
      properties:
        platform: { type: string, examples: [android] }
        version: { type: string, examples: ["0.2.0"] }
        build: { type: integer, format: int64, description: Android 的 versionCode }
        published_at: { type: string, examples: ["2026-12-21"] }
        url: { type: string, description: 安装包地址，必须是 https }
        sha256: { type: string, description: 安装包的 SHA-256，64 位小写十六进制 }
        signature:
          type: string
          description: |
            安装包 SHA-256 的 Ed25519 签名（base64）。应用使用内置公钥验证签名，
            验签通过之后才下载安装包。
        size: { type: integer, format: int64 }
        min_version: { type: string, description: 低于它的客户端应提示必须更新 }
        notes: { type: string, description: 这一版的更新说明 }
    ReleaseList:
      type: object
      required: [releases]
      properties:
        releases:
          type: array
          items: { $ref: "#/components/schemas/Release" }
    SyncHead:
      type: object
      required: [head, schema_version]
      properties:
        head: { type: integer, format: int64 }
        schema_version: { type: integer }
    TelemetryPing:
      type: object
      required: [install_id]
      additionalProperties: false
      properties:
        install_id:
          type: string
          minLength: 16
          maxLength: 128
          description: 首次启动时随机生成并保存在应用私有目录，卸载或清空数据后重新生成
        app_version: { type: string, maxLength: 64 }
        platform: { type: string, maxLength: 32 }
