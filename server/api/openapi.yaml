openapi: 3.1.0
info:
  title: 知新 API
  version: 0.1.0
  description: |
    知新的自建后端。职责与边界见 docs/adr/0008，技术框架见 docs/adr/0009。
    本文件是接口的唯一真相；改动时服务端处理函数与客户端调用放进同一个 push。
    1.0.0 之前不承诺兼容（ADR-0001），客户端与服务端同时升级。

    所有错误都是 application/problem+json，客户端按 `code` 分支，不解析 `detail`。
servers:
  - url: http://localhost:8080
    description: 本地开发（内存存储）

security:
  - bearer: []

tags:
  - name: meta
  - name: auth
  - name: sync
  - name: backup
  - name: llm
  - name: app

paths:
  /healthz:
    get:
      tags: [meta]
      security: []
      summary: 进程存活
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [meta]
      security: []
      summary: 依赖可用，并返回服务端接受的客户端 schema 版本
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/auth/register:
    post:
      tags: [auth]
      security: []
      summary: 注册并登录当前设备（按来源地址限流，与登录共用一个令牌桶）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: 已注册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409":
          description: "`email_taken`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录，每台设备一个会话（按来源地址限流，与注册共用一个令牌桶）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: 已登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401":
          description: "`invalid_credentials`，不区分邮箱不存在与密码错误"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: 用刷新令牌换一组新令牌，旧的两枚立即失效（按账号与来源地址限流）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              additionalProperties: false
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: 已轮换
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/email/verify/request:
    post:
      tags: [auth]
      summary: 给当前账号的邮箱发一封验证码邮件
      description: |
        已确认的邮箱直接返回 204，不重复发信；刚发过的账号返回 429，`Retry-After`
        给出建议等待的秒数。服务端没有配置 SMTP 时返回 503，客户端提示稍后再试。
        验证码为六位数字，默认十分钟有效，只存 HMAC-SHA256。
      responses:
        "204": { description: 已发送，或邮箱已经确认 }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/email/verify/confirm:
    post:
      tags: [auth]
      summary: 用验证码确认当前账号的邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 6, maxLength: 6, pattern: "^[0-9]{6}$" }
      responses:
        "204": { description: 已确认 }
        "400":
          description: "`invalid_code`：不存在、已过期、已被换掉或输错次数过多"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/password/forgot:
    post:
      tags: [auth]
      summary: 向已验证的邮箱发一封重设密码验证码
      description: |
        邮箱不存在或还没有验证时同样返回 204，不区分两种情况，避免用这个接口
        探测哪些邮箱注册过。发信失败返回 503，客户端提示稍后再试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "204": { description: 已发送；邮箱不存在或未验证时不发信 }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/password/reset:
    post:
      tags: [auth]
      summary: 用验证码重设密码，并作废该账号的全部会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, minLength: 6, maxLength: 6, pattern: "^[0-9]{6}$" }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: 已重设，其他设备需要重新登录 }
        "400":
          description: "`invalid_code` 或 `invalid_request`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出当前设备
      responses:
        "204": { description: 已退出 }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      tags: [auth]
      summary: 当前账号
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [auth]
      summary: 删除账号，连同同步序列、附件、备份与用量一并删除
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/sync/head:
    get:
      tags: [sync]
      summary: 服务端序列的最新位置
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncHead" }
  /v1/sync/commits:
    delete:
      tags: [sync]
      summary: 清空该账号的提交序列，服务端 head 重置为 0
      description: |
        删除这个账号在服务端保存的全部提交，并把 head 重置为 0，账号与整库备份不受影响。
        客户端在设置页“清除云端数据”时调用，与 `DELETE /v1/backups` 一起把云端恢复到空白状态。
        操作不可撤销：清空后其他设备无法再拉取这些提交，未推送的本机改动不会再出现在云端，
        因此调用前客户端应提示用户确认。成功返回 204，没有响应体。
      responses:
        "204": { description: 已清空 }
        "401": { $ref: "#/components/responses/Problem" }
    get:
      tags: [sync]
      summary: 拉取 seq 大于 after 的提交
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitPage" }
    post:
      tags: [sync]
      summary: 推送本机提交
      description: |
        `base_seq` 必须等于服务端当前 head，否则返回 409，`extra.head` 给出最新位置；
        客户端先拉取、在本机应用为新的提交，再重新推送。已经收到过的 `request_id`
        会被跳过，因此丢失响应后原样重试是安全的。每次 1 到 200 条。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_seq, commits]
              properties:
                base_seq: { type: integer, format: int64 }
                commits:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/Commit" }
      responses:
        "200":
          description: 已追加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /v1/blobs/{sha256}:
    parameters:
      - { name: sha256, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    head:
      tags: [sync]
      summary: 附件是否已上传
      description: |
        按内容寻址：路径里的 sha256 是附件内容的哈希，服务端按账号隔离。
        200 表示这个账号已经存过相同的内容，`Content-Length` 给出字节数；
        HEAD 没有响应体，未命中时只有 404。
      responses:
        "200": { description: 已存在 }
        "400": { description: 路径里的 sha256 不是 64 位小写十六进制 }
        "404": { description: 不存在 }
    get:
      tags: [sync]
      summary: 下载附件
      responses:
        "200":
          description: 原始字节，`X-Content-SHA256` 与路径一致
          content:
            application/octet-stream: {}
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [sync]
      summary: 上传附件，服务端核对哈希
      description: |
        请求体是原始字节，单个附件的上限由 ZHIXIN_MAX_ATTACHMENT_BYTES 决定。
        内容与路径里的 sha256 不一致时返回 400，超过上限返回 413。同一账号
        重复上传相同内容写到同一个键，结果不变。
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "201": { description: 已保存 }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }

  /v1/backups:
    delete:
      tags: [backup]
      summary: 清空该账号的全部整库备份
      description: |
        删除这个账号在服务端保存的全部备份，元数据行与对象存储里的字节一并删除，账号与同步
        提交序列不受影响。客户端在设置页“清除云端数据”时调用，与 `DELETE /v1/sync/commits`
        一起把云端恢复到空白状态。操作不可撤销：云端副本删除之后无法再下载，只剩本机数据库
        里的数据，因此调用前客户端应提示用户确认。成功返回 204，没有响应体。
      responses:
        "204": { description: 已清空 }
        "401": { $ref: "#/components/responses/Problem" }
    get:
      tags: [backup]
      summary: 列出整库备份，新的在前
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
    post:
      tags: [backup]
      summary: 上传一份版本库备份 zip，超过保留份数时删最旧的
      parameters:
        - { name: X-Content-SHA256, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: X-Schema-Version, in: header, required: true, schema: { type: integer } }
        - { name: X-Device-Name, in: header, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/zip: {}
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /v1/backups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [backup]
      summary: 下载备份；客户端按现有的版本库恢复流程预检
      responses:
        "200":
          description: zip 原样返回，响应头带 X-Content-SHA256 与 X-Schema-Version
          content:
            application/zip: {}
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [backup]
      summary: 删除一份备份
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/llm/models:
    get:
      tags: [llm]
      summary: 代理允许的模型，OpenAI 列表格式
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
  /v1/llm/quota:
    get:
      tags: [llm]
      summary: 今日用量与额度
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMQuota" }
  /v1/llm/chat/completions:
    post:
      tags: [llm]
      summary: OpenAI Chat Completions 代理
      description: |
        请求体按 Chat Completions 原样转发，服务端只读取 `model` 与 `stream`。
        流式请求应带 `stream_options.include_usage`，服务端据此记录用量。
        提供方的状态码与响应体原样返回；代理自身的拒绝用 problem+json：
        `model_not_allowed`（400）、`quota_exceeded`（429）、`unavailable`（503，未配置提供方 key）、
        `upstream_failed`（502）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string }
                stream: { type: boolean }
      responses:
        "200":
          description: 提供方的响应，流式时为 text/event-stream
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/app/releases:
    get:
      tags: [app]
      security: []
      summary: 应用安装包的发布清单
      description: |
        不需要登录：更新提示在登录之前也可能出现。清单来自服务端本地的发布文件
        （`ZHIXIN_RELEASE_FILE`），服务端只原样给出每个平台的版本、构建号、地址与
        说明，不比较客户端版本，也不决定是否必须更新；客户端按平台取一项，自己比较
        `version` 与 `build`。没有配置发布文件时返回空数组，客户端据此不提示更新。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseList" }

  /v1/telemetry/active:
    post:
      tags: [app]
      security: []
      summary: 匿名上报一次活跃
      description: |
        没有登录的设备每天最多上报一次，内容只有随机安装标识、应用版本与平台，
        不含学习内容。服务端按收到的自然日保存一行，只存安装标识的
        HMAC-SHA256，原始标识不落库；同一标识同一天重复上报是幂等的，客户端丢失
        响应后原样重试安全。登录用户的活跃由服务端按请求日期统计，不需要调用这个
        接口。数据按 180 天滚动删除。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryPing" }
      responses:
        "204": { description: 已记录，或今天已经记录过 }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/feedback:
    post:
      tags: [app]
      security: []
      summary: 提交一条应用内反馈
      description: |
        登录与否都可以提交，服务端不把反馈绑定到账号。`content` 是用户填写的正文，
        `diagnostics` 是可选的诊断摘要，两者都原样保存，服务端不解析内容；客户端在
        附带诊断摘要之前应在本地说明会提交哪些内容。按来源地址限流。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Feedback" }
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackReceipt" }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 不透明访问令牌，一小时过期；刷新令牌三十天过期并在每次刷新时轮换。
  responses:
    RateLimited:
      description: 尝试过于频繁，`code` 为 `rate_limited`；`Retry-After` 给出建议的等待秒数
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
          description: 建议的重试间隔，秒
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: 错误
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, examples: ["urn:zhixin:problem:conflict"] }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - invalid_credentials
            - invalid_code
            - email_taken
            - not_found
            - conflict
            - payload_too_large
            - model_not_allowed
            - rate_limited
            - quota_exceeded
            - upstream_failed
            - unavailable
            - not_implemented
            - internal
        detail: { type: string, description: 只给开发者看，不含学习内容 }
        request_id: { type: string }
        extra: { type: object, additionalProperties: true }
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        device_name: { type: string, maxLength: 64 }
    Tokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
        user_id: { type: string }
    Change:
      type: object
      description: 对应客户端 revision_change 的一行（docs/01 第 7 章）
      required: [table, row_key, op]
      properties:
        table: { type: string }
        row_key: { type: string }
        op: { type: string, enum: [insert, update, delete] }
        # 行内容原样转发，服务端不解释。用 json.RawMessage 而不是 interface{}，
        # 否则大整数会被解码成 float64 而改变数值。
        before:
          description: "update 与 delete 必填"
          x-go-type: json.RawMessage
        after:
          description: "insert 与 update 必填"
          x-go-type: json.RawMessage
    Commit:
      type: object
      required: [request_id, device_id, schema_version, actor, action, created_at, changes]
      properties:
        seq: { type: integer, format: int64, readOnly: true }
        request_id: { type: string, maxLength: 64 }
        device_id: { type: string, maxLength: 64 }
        schema_version: { type: integer }
        actor: { type: string, enum: [user, ai, system] }
        action: { type: string }
        created_at: { type: string, description: "客户端时间，YYYY-MM-DD HH:MM:SS" }
        received_at: { type: string, format: date-time, readOnly: true }
        changes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Change" }
    Backup:
      type: object
      properties:
        id: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        schema_version: { type: integer }
        device_name: { type: string }
        created_at: { type: string, format: date-time }
    BackupList:
      type: object
      required: [backups]
      properties:
        backups:
          type: array
          items: { $ref: "#/components/schemas/Backup" }
    CommitPage:
      type: object
      required: [commits, head, has_more]
      properties:
        commits:
          type: array
          items: { $ref: "#/components/schemas/Commit" }
        head: { type: integer, format: int64 }
        has_more: { type: boolean }
    Feedback:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: 用户填写的反馈正文
        contact:
          type: string
          format: email
          maxLength: 254
          description: 可选的联系邮箱，用于回复这条反馈
        app_version:
          type: string
          maxLength: 64
          description: 客户端版本名，例如 0.2.0-dev+3
        platform:
          type: string
          maxLength: 32
          description: 平台，例如 android
        diagnostics:
          type: string
          maxLength: 65536
          description: 可选的诊断摘要，客户端先说明附带哪些内容
    FeedbackReceipt:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    LLMQuota:
      type: object
      required: [day, used_tokens, daily_tokens]
      properties:
        day: { type: string, format: date }
        used_tokens: { type: integer, format: int64 }
        daily_tokens: { type: integer, format: int64 }
    Me:
      type: object
      required: [user_id, email, email_verified, created_at]
      properties:
        user_id: { type: string }
        email: { type: string }
        email_verified: { type: boolean, description: 邮箱是否已经用验证码确认 }
        created_at: { type: string, format: date-time }
    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id: { type: string }
        object: { type: string, examples: [model] }
        owned_by: { type: string }
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, examples: [list] }
        data:
          type: array
          items: { $ref: "#/components/schemas/Model" }
    PushResult:
      type: object
      required: [head]
      properties:
        head: { type: integer, format: int64 }
    Ready:
      type: object
      required: [status, schema_version]
      properties:
        status: { type: string, const: ready }
        schema_version: { type: integer, examples: [27] }
    Release:
      type: object
      required: [platform, version, build, url]
      properties:
        platform: { type: string, examples: [android] }
        version: { type: string, examples: ["0.2.0"] }
        build: { type: integer, format: int64, description: Android 的 versionCode }
        published_at: { type: string, examples: ["2026-12-21"] }
        url: { type: string, description: 安装包地址，服务端只校验是 http 或 https }
        sha256: { type: string, description: 安装包的 SHA-256，可选 }
        size: { type: integer, format: int64 }
        min_version: { type: string, description: 低于它的客户端应提示必须更新 }
        notes: { type: string, description: 这一版的更新说明 }
    ReleaseList:
      type: object
      required: [releases]
      properties:
        releases:
          type: array
          items: { $ref: "#/components/schemas/Release" }
    SyncHead:
      type: object
      required: [head, schema_version]
      properties:
        head: { type: integer, format: int64 }
        schema_version: { type: integer }
    TelemetryPing:
      type: object
      required: [install_id]
      additionalProperties: false
      properties:
        install_id:
          type: string
          minLength: 16
          maxLength: 128
          description: 首次启动时随机生成并保存在应用私有目录，卸载或清空数据后重新生成
        app_version: { type: string, maxLength: 64 }
        platform: { type: string, maxLength: 32 }
