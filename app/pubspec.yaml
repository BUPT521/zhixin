name: zhixin
description: "知新 · 一个懂你的学习搭子"
publish_to: 'none'

version: 0.2.0+3

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter

  # 数据层：单文件 SQLite，DDL 来自 docs/01 第 4 章；表结构与查询由 drift 负责，连接走下面 sqlite3 的自带库。
  drift: ^2.35.4
  path: ^1.9.1
  path_provider: ^2.1.6

  # 导出/恢复：zip 数据包。
  archive: ^4.7.1
  crypto: ^3.0.8
  file_picker: ^13.4.0
  xml: ^7.0.1

  # 语义索引：进程内的 zvec 向量库，只用它保存可从业务库重建的向量。
  # 固定到具体版本：zvec 仍在 0.x，跨小版本升级先跑索引契约测试。
  zvec: 0.8.0

  # 业务库与 FTS5 使用随包携带的 SQLite；语义索引改用下面的 zvec。
  sqlite3: ^3.9.1

  # 接模型：HTTP 直连，key 存 Android Keystore。
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  # 拍照用应用内相机：快门之后直接框选，不经过系统相机的确认界面。
  camera: ^0.12.2
  # 裁剪题目图片：纯 Dart 解码、裁剪与 JPEG 编码，不引原生库。
  image: ^4.13.1
  # 框选交互用现成控件，裁剪在 compute 里完成。
  crop_your_image: ^2.0.1
  speech_to_text: ^7.5.0

  # 回答里的 Markdown：按段缓存，流式输出时不重解析整段；依赖要求 Flutter 3.47 以上。
  gpt_markdown: ^1.4.1

  # 基础控件、路由、Markdown 与本地化，以及 Forui 没有的控件（如底部面板、日期时间选择）。
  material_ui: ^1.11.1
  # iOS 与 macOS 路由过渡。
  cupertino_ui: ^1.1.7

  # 界面组件与主题：页面骨架、按钮、表单、列表、对话框、面板、提示与日期时间选择。
  forui: 0.28.0
  # 界面图标：业务图标与 Forui 控件内部用同一套 Lucide 图形。
  forui_lucide: ^0.28.0

  # 安排页的周视图，只提供网格、事件块与翻周手势。
  calendar_view: ^2.0.0

  # 崩溃与诊断上报：自建 Sentry，DSN 由构建参数注入。
  sentry_flutter: ^10.5.0

  # 打开回答里的链接。
  url_launcher: ^6.3.3
  cryptography: ^2.9.0

# jni 1.2.0（2026-11-18 发布）在真机上解析 android.content.Context 时抛
# ClassNotFoundException，path_provider_android 2.3.x 走它取数据目录，应用启动
# 即打不开数据库。先固定回 1.1.2 与配套的 jni_flutter 1.0.4+1，等上游修正。
dependency_overrides:
  jni: 1.1.2
  jni_flutter: 1.0.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # drift 表类与数据类的代码生成。
  drift_dev: ^2.35.0
  build_runner: ^2.6.0

# sqlite3 在测试里用系统自带的 SQLite：Linux 取 libsqlite3.so，Windows 取
# winsqlite3.dll，这样 CI 不必从 GitHub Releases 下载（偶发 504）。Android 的
# 系统库不对外提供 libsqlite3.so，因此只在 Android 随包放入预编译库，其余平台
# 继续用系统库；业务库与 FTS5 依赖这份 SQLite。
hooks:
  user_defines:
    sqlite3:
      source:
        android: sqlite3
        default: system
      # Windows 自带的库叫 winsqlite3.dll，其余平台按默认名加载 libsqlite3.so。
      name:
        windows: winsqlite3
        default: sqlite3

flutter:
  uses-material-design: true
  # 提示词与请求文本独立成文件；改文案不需要改 Dart 代码。
  assets:
    - assets/prompts/
