name: CI 与发版

on:
  push:
    branches: [main]
    # 只改文档时不占 Actions 分钟；代码、构建与 workflow 本身仍会触发。
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # 正式包不跟 push 一起出：发版归陈思源，需要时手动点一次。
  workflow_dispatch:

env:
  # Flutter 版本的唯一来源：升级只改这一行，再同步 docs 里的说法。
  FLUTTER_VERSION: '3.50.0'

permissions:
  contents: read

# 发版和日常检查分开排队：别人的 push 不会把跑着的 release 取消，两次发版也不互相打断。
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  analyze:
    name: 静态检查
    # 与测试分开排队：格式或静态检查失败不必等测试跑完，测试也不必等生成代码比对。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # 生成结果随源文件提交，这里重新生成后比对，避免表结构或查询改了却没更新
      # app_database.g.dart 与 .drift 的生成结果（CONTRIBUTING 第 7 节）。
      - run: dart run build_runner build
      - run: git diff --exit-code
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # zvec 的 C 库不随 Dart 包发布：测试前下载预编译包，按 SHA-256 校验后解压，
      # 让测试通过 ZVEC_LIBRARY_PATH 加载它（ADR-0022 实施方案第 7 节）。
      # 缓存下载目录，命中时省掉 40 MB 下载与 GitHub Releases 偶发的 504。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/zvec-dart
          key: zvec-sdk-${{ runner.os }}-0.8.0

      - name: 下载并校验 zvec C 库
        run: |
          set -euo pipefail
          VERSION=0.8.0
          SHA=bc7097a293ec1677ac84c46e76afef880359766cd1e1cdf2494ef669237b134a
          CACHE="$HOME/.cache/zvec-dart"
          ARCHIVE="$CACHE/zvec-sdk-linux-amd64-$VERSION.tar.gz"
          SDK_DIR="$CACHE/linux-amd64-$VERSION"
          mkdir -p "$CACHE"
          # 缓存里的归档也可能不完整：校验不过就重新下载，解压前一定再核对一次。
          if [ ! -f "$ARCHIVE" ] || ! echo "$SHA  $ARCHIVE" | sha256sum -c - >/dev/null 2>&1; then
            curl --fail --location --retry 3 \
              --output "$ARCHIVE" \
              "https://github.com/alibaba/zvec/releases/download/v$VERSION/zvec-sdk-linux-amd64.tar.gz"
          fi
          echo "$SHA  $ARCHIVE" | sha256sum -c -
          rm -rf "$SDK_DIR"
          mkdir -p "$SDK_DIR"
          tar -xzf "$ARCHIVE" -C "$SDK_DIR"
          echo "ZVEC_LIBRARY_PATH=$SDK_DIR/lib/libzvec_c_api.so" >> "$GITHUB_ENV"

      - run: flutter test

  server:
    name: 服务端检查与测试
    # API 后端（server/，ADR-0009）。Go 版本跟随 server/go.mod，不另设变量。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zhixin_test
          POSTGRES_DB: zhixin_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U zhixin_test -d zhixin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go mod tidy -diff
      - run: go vet ./...

      # 生成代码与客户端 drift 一样提交入库；重新生成后比对，避免契约或查询改了
      # 却没更新生成文件（ADR-0015 第 2、4 条）。两个生成器都只作开发期工具，
      # 版本钉在这里。
      - name: 核对 sqlc 生成
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/store/db
          test -z "$(git status --porcelain -- internal/store/db)"

      - name: 核对契约生成
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2 \
            -config api/cfg.yaml api/openapi.yaml
          git diff --exit-code -- internal/api
          test -z "$(git status --porcelain -- internal/api)"

      - run: go test -race ./...
        env:
          ZHIXIN_TEST_DATABASE_URL: postgresql://zhixin_test@localhost:${{ job.services.postgres.ports[5432] }}/zhixin_test?sslmode=disable

  build-apk:
    name: 构建 debug APK
    # main 的 push 和所有 PR 都构建：PR 上只验证「能打出来」，合进 main 才留构件给真机验收。
    # 手动发版时不重复打 debug 包，省一次构建。
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 第一次构建要下 Gradle 与依赖，缓存后能省掉大半时间。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # zvec 的 Gradle 任务从 GitHub Releases 下载 C 库；缓存归档，避免 504 时构建失败。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/zvec-dart
          key: zvec-sdk-${{ runner.os }}-0.8.0-android-arm64

      - run: flutter pub get
      # 验收用真机都是 arm64：三 ABI 一起打约 160 MB，只打 arm64 约 87 MB。
      - run: flutter build apk --debug --target-platform android-arm64

      # 同名制品配 overwrite：每次 push 只留当次这一个 debug 包，不按提交累积，
      # 否则每天十几次推送各存 68 MB，Actions 存储很快超配额。
      # 账户配额触顶后删除旧制品并不会立刻恢复，上传失败不该把“能构建”一起标红，
      # 所以这里 continue-on-error；配额恢复、能稳定上传之后再删掉这一行。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          name: zhixin-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build-release:
    name: 构建 release APK（正式签名）
    # 只手动触发；先跑完检查与测试再出包，红着不出。
    if: github.event_name == 'workflow_dispatch'
    needs: [analyze, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 同 build-apk：缓存 zvec 的 C 库归档，避免 GitHub Releases 偶发 504。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/zvec-dart
          key: zvec-sdk-${{ runner.os }}-0.8.0-android-arm64

      # 缺 secret 时直接红，别悄悄出一只 debug 签名的包。
      - name: 检查签名 secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SIGNING_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_KEY_BASE64 }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing RELEASE_KEY_PASSWORD"
          [ -n "$SIGNING_KEY_BASE64" ] || missing="$missing RELEASE_SIGNING_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 secret:$missing（配置方法见 app/README 的「签名」一节）"
            exit 1
          fi

      - name: 还原 keystore 与 key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        run: |
          set -euo pipefail
          # keystore 放 runner 的临时目录，不落进工作区，免得被打进构件。
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          # 格式与 android/app/build.gradle.kts 读的一致；storeFile 用绝对路径。
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PATH" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - run: flutter pub get

      - name: 构建 release APK
        # 只出 arm64：三 ABI 52 MB，arm64 单独 18 MB。要覆盖 32 位机器时改成
        # android-arm64,android-arm（约 33 MB），别再加回 x86_64（只给模拟器用）。
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: 校验证书不是 debug
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(ls "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK 还是 debug 证书，检查 key.properties 是否被覆盖"
            exit 1
          fi

      - name: 记录版本与 SHA-256
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml)
          {
            echo "### release APK"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`$VERSION\` |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 大小 | $(du -h "$APK" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 发布清单签名：用 Ed25519 私钥（PKCS8，base64 存在 secret 里）对 APK 的
      # SHA-256 小写十六进制字符串签名，产出 .sha256 与 base64 的 .sig。应用内置
      # 对应公钥，更新检查先核对版本、哈希与签名再提示；签名缺失或对不上就不提示。
      # 对签名对象的口径写在 app/README 的「签名」一节：签的是 64 字节的十六进制
      # 字符串本身，不加换行，应用按同样的字节核对。
      - name: 签名与清单
        env:
          SIGNING_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "::error::缺少签名 secret: RELEASE_SIGNING_KEY_BASE64（生成方法见 app/README 的「签名」一节）"
            exit 1
          fi
          APK=build/app/outputs/flutter-apk/app-release.apk
          OUT=build/app/outputs/flutter-apk
          KEY="$RUNNER_TEMP/release-signing-key.pem"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          APP_PUBLIC_KEY="$RUNNER_TEMP/release-app-public-key.pem"
          sed -n '/^-----BEGIN PUBLIC KEY-----$/,/^-----END PUBLIC KEY-----$/p' \
            lib/platform/release_signing_key.dart > "$APP_PUBLIC_KEY"
          if ! openssl pkey -in "$KEY" -pubout | cmp -s - "$APP_PUBLIC_KEY"; then
            echo '::error::发版签名私钥与应用内置公钥不匹配'
            exit 1
          fi

          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '%s\n' "$SHA" > "$OUT/app-release.apk.sha256"
          printf '%s' "$SHA" > "$RUNNER_TEMP/apk-sha256.txt"
          openssl pkeyutl -sign -rawin -inkey "$KEY" \
            -in "$RUNNER_TEMP/apk-sha256.txt" -out "$RUNNER_TEMP/apk-sha256.sig"
          base64 -w0 "$RUNNER_TEMP/apk-sha256.sig" > "$OUT/app-release.apk.sig"

          VERSION_FULL=$(sed -n 's/^version: *//p' pubspec.yaml)
          VERSION=${VERSION_FULL%%+*}
          BUILD=${VERSION_FULL##*+}
          SIGNATURE=$(cat "$OUT/app-release.apk.sig")
          SIZE=$(stat -c %s "$APK")
          URL="https://<发行域名>/downloads/zhixin-${VERSION}.apk"
          {
            echo "### 发布清单片段"
            echo ""
            echo "把下面一段填进 ZHIXIN_RELEASE_FILE 的 releases，url 换成安装包实际下载地址，必须是 https。"
            echo ""
            echo '```json'
            printf '{"platform":"android","version":"%s","build":%s,"published_at":"%s","url":"%s","sha256":"%s","signature":"%s","size":%s}\n' \
              "$VERSION" "$BUILD" "$(date -u +%F)" "$URL" "$SHA" "$SIGNATURE" "$SIZE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zhixin-release-manifest-${{ github.run_number }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/app-release.apk.sig
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zhixin-release-apk-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # R8 混淆表：线上崩溃栈要靠它还原，跟包一起留档。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zhixin-release-mapping-${{ github.run_number }}
          path: app/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30
