name: 部署服务端

# main 上 server/ 的改动通过与 CI 相同的检查之后，交叉编译 linux/amd64 可执行
# 文件，用专用部署账号上传、重启并核对 /readyz；核对失败时换回上一份文件。
# 取舍与代价见 ADR-0032，服务器上的账号、secrets 与手工步骤见 server/运维手册.md
# 的「部署与凭据」一节。表结构与 api.env 的变化不在这条流水线里执行。
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

# 部署串行：同一时间只跑一次，后一次等前一次结束，避免两个版本互相覆盖。
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  verify:
    name: 服务端检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zhixin_test
          POSTGRES_DB: zhixin_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U zhixin_test -d zhixin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go mod tidy -diff
      - run: go vet ./...

      # 生成代码与 CI 的服务端任务一样提交入库；重新生成后比对，避免契约或查询改了
      # 却拿旧生成物构建部署（ADR-0015、ADR-0032）。生成器版本与 ci.yml 保持一致。
      - name: 核对 sqlc 生成
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/store/db
          test -z "$(git status --porcelain -- internal/store/db)"

      - name: 核对契约生成
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2 \
            -config api/cfg.yaml api/openapi.yaml
          git diff --exit-code -- internal/api
          test -z "$(git status --porcelain -- internal/api)"

      - run: go test -race ./...
        env:
          ZHIXIN_TEST_DATABASE_URL: postgresql://zhixin_test@localhost:${{ job.services.postgres.ports[5432] }}/zhixin_test?sslmode=disable

  deploy:
    name: 构建并部署
    needs: verify
    runs-on: ubuntu-latest
    # 交叉编译与上传要占几分钟，十分钟的上限在 2026-11-24 两次把上传并切换截断
    # （运维手册「自动部署与回滚」有记录），这里留出重试与波动的时间。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 交叉编译 linux/amd64
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o zhixin-api ./cmd/zhixin-api
          # 上传的是压缩件：Runner 到服务器的上行只有十几 KB/s 时，20 MB 传不完，
          # 压缩之后是 7 MB 左右，见 server/运维手册.md 的「自动部署与回滚」。
          gzip -9 -k zhixin-api

      # 私钥只放在 DEPLOY_SSH_KEY；主机指纹固定成 known_hosts，不依赖 Runner
      # 首次连接时自动信任。两个 secret 为空时这里直接失败，不会带着默认信任部署。
      - name: 准备 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::缺少 DEPLOY_SSH_KEY 或 DEPLOY_KNOWN_HOSTS，配置方法见 server/运维手册.md 的「部署与凭据」一节"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 远端只做四件事：备份当前文件、换上新文件、重启、轮询 /readyz。轮询不
      # 通过就换回备份并重启，工作流标红；成功后 Runner 再核对一次公网入口。
      #
      # 上传与切换都带上连接超时和保活参数：链路卡住时在十几秒内报错结束，失败
      # 时线上仍是切换前的那一份文件。上传的是 gzip 之后的文件，2026-11-26 的
      # 一次部署因为 Runner 到服务器的上行只有约 15 KB/s，20 MB 的原始文件没能在
      # 二十分钟内传完，压缩之后是 7 MB 左右；文件名带上运行编号，同一提交重跑
      # 不会复用上一次写了一半的文件。这一步另设十二分钟上限，慢链路不会一直拖到
      # 整个任务的上限。
      - name: 上传并切换
        timeout-minutes: 12
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SHA=${GIT_SHA:0:12}
          NAME=zhixin-api.new-$SHA-$RUN_ID
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          scp -i ~/.ssh/deploy_key "${SSH_OPTS[@]}" \
            server/zhixin-api.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/zhixin/bin/$NAME.gz"
          ssh -i ~/.ssh/deploy_key "${SSH_OPTS[@]}" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $NAME" <<'REMOTE'
          set -euo pipefail
          NAME="$1"
          BIN=/opt/zhixin/bin
          cd "$BIN"
          gunzip -c "$NAME.gz" > "$NAME"
          rm -f "$NAME.gz"
          cp -p zhixin-api zhixin-api.prev
          chmod 0755 "$NAME"
          mv -f "$NAME" zhixin-api
          sudo /usr/bin/systemctl restart zhixin-api
          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS -m 2 http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::部署后 /readyz 没有通过，换回上一份可执行文件"
            mv -f zhixin-api.prev zhixin-api
            sudo /usr/bin/systemctl restart zhixin-api
            journalctl -u zhixin-api -n 20 -o cat --no-pager || true
            exit 1
          fi
          echo "已切换到 $NAME"
          REMOTE

      - name: 核对公网入口
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --retry-connrefused \
            https://zhixin.chensiyuan.work/readyz | tee /tmp/readyz.json
          {
            echo "### 服务端部署"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 就绪 | \`$(cat /tmp/readyz.json)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
