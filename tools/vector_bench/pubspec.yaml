name: vector_bench
description: "20 万条 1024 维向量的 zvec 量化与 sqlite-vec 对照基准，只在真机上运行。"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # 被测的两个引擎：zvec 0.8.0 与 sqlite-vec 0.1.9（由 sqlite3_vec 编译进包）。
  zvec: 0.8.0
  sqlite3: ^3.9.1
  sqlite3_vec: ^0.1.2

  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 与 app/pubspec.yaml 相同：Android 的系统库不对外提供 libsqlite3.so，
# 因此随包编译一份；其他平台用系统自带的库。
hooks:
  user_defines:
    sqlite3:
      source:
        android: sqlite3
        default: system
      name:
        windows: winsqlite3
        default: sqlite3

flutter:
  uses-material-design: true
